name: Automated Stock Screener Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1-5'

jobs:
  update-data:
    runs-on: ubuntu-latest

    env:
      INDIAN_API_KEY: ${{ secrets.INDIAN_API_KEY }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run screener script
        run: python update_screener.py

      - name: Commit and push updated stocks_data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git status
          git add stocks_data.json
          git commit -m "Auto-update stock prices [skip ci]" || exit 0
          git push origin main
