
name: Automated Stock Screener Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1-5'

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance requests

      - name: Run screener script
        run: python update_screener.py

      - name: Commit and push updated stocks.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git status
          git add stocks.json
          git commit -m "Auto-update stock prices via GitHub Actions [skip ci]" || exit 0
          git pull origin main --rebase || git rebase --abort
          git push origin main
          
