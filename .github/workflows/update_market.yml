name: Automated Stock Screener Update

on:
  schedule:
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install yfinance pandas requests

      - name: Run stock screener script
        run: |
          python update_screener.py

      - name: Commit and push updated stocks.json
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add stocks.json
          git commit -m "Auto-update stock prices via GitHub Actions" || echo "No changes to commit"
          git push
          
