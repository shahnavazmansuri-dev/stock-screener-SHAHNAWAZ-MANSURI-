name: Watchlist 5m Sync

on:
  schedule:
    - cron: '*/5 4-10 * * 1-5'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install yfinance pandas
      - run: python update_watchlist.py
      - run: |
          git config --global user.name "Watchlist Bot"
          git config --global user.email "bot@github.com"
          git add watchlist.json
          git commit -m "Auto-update 5m watchlist" || exit 0
          git push
          
