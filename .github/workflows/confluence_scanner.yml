name: Confluence Scanner

on:
  workflow_dispatch:
  schedule:
    # 09:45 IST = 04:15 UTC, Monday-Friday
    - cron: '15 4 * * 1-5'

jobs:
  confluence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pyarrow

      - name: Run Confluence Scanner
        run: python confluence_scanner.py

      - name: Commit Confluence data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add confluence_scanner_data.json

          git commit -m "Update Confluence Scanner [skip ci]" || exit 0

          git pull --rebase origin main
          git push origin main
