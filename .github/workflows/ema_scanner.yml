name: EMA Scanner Update

on:
  workflow_dispatch:
  schedule:
    - cron: "45 3 * * 1-5"

permissions:
  contents: write

concurrency:
  group: ema-scanner
  cancel-in-progress: false

jobs:
  ema-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pyarrow

      - name: Run EMA scanner
        run: python ema_scanner.py

      - name: Commit EMA scanner data
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git rebase origin/main

          git add ema_scanner_data.json

          if git diff --cached --quiet; then
            echo "No EMA scanner data changes to commit."
            exit 0
          fi

          git commit -m "Update EMA scanner data [skip ci]"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "EMA scanner data pushed successfully."
              exit 0
            fi

            echo "Push rejected. Updating from origin/main and retrying..."
            git fetch origin main
            git rebase origin/main
          done

          echo "Failed to push EMA scanner data after 3 attempts."
          exit 1
