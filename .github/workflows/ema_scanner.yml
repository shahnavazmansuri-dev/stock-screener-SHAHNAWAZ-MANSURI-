name: EMA Scanner Update

on:
  workflow_dispatch:
  schedule:
    - cron: "45 3 * * 1-5"

permissions:
  contents: write

concurrency:
  group: ema-scanner
  cancel-in-progress: false

jobs:
  ema-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance pytz pyarrow pandas

      - name: Update repository before scanner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Run EMA scanner
        run: |
          python ema_scanner.py

      - name: Check EMA scanner output
        run: |
          echo "Checking ema_scanner_data.json..."
          python - <<'PY'
          import json

          with open("ema_scanner_data.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print("EMA Scanner count:", data.get("count", 0))
          print("Stocks found:", len(data.get("stocks", [])))

          for stock in data.get("stocks", [])[:10]:
              print(
                  stock.get("symbol"),
                  stock.get("signal"),
                  "EMA9:", stock.get("ema9"),
                  "EMA20:", stock.get("ema20"),
                  "EMA200:", stock.get("ema200"),
                  "Price:", stock.get("price")
              )
          PY

      - name: Commit EMA scanner data
        shell: bash
        run: |
          set -e

          git add ema_scanner_data.json

          if git diff --cached --quiet; then
            echo "No EMA scanner data changes to commit."
            exit 0
          fi

          git commit -m "Update EMA scanner data [skip ci]"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "EMA scanner data pushed successfully."
              exit 0
            fi

            echo "Push rejected. Syncing with origin/main..."

            git fetch origin main
            git reset --soft origin/main
            git add ema_scanner_data.json

            if git diff --cached --quiet; then
              echo "No EMA scanner changes after sync."
              exit 0
            fi

            git commit -m "Update EMA scanner data [skip ci]"
          done

          echo "Failed to push EMA scanner data after 3 attempts."
          exit 1
