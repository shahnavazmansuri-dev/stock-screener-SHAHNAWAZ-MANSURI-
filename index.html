<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSE Multi-Timeframe Demand Zone Screener - Shahnawaz Mansuri</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0d1117; color: #c9d1d9; margin: 0; padding: 10px; }
        .header { text-align: center; border-bottom: 1px solid #30363d; padding-bottom: 8px; margin-bottom: 10px; }
        h2 { color: #58a6ff; margin: 0 0 4px 0; font-size: 16px; }
        .admin-badge { color: #f0883e; font-size: 11px; font-weight: bold; }
        .stats { font-size: 11px; color: #8b949e; margin-top: 4px; }
        
        .tf-container { display: flex; gap: 4px; justify-content: center; margin-bottom: 8px; flex-wrap: wrap; }
        .tf-btn { background: #161b22; color: #8b949e; border: 1px solid #30363d; padding: 5px 9px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: bold; }
        .tf-btn.active { background: #238636; color: #fff; border-color: #238636; }

        .tabs { display: flex; gap: 6px; justify-content: center; margin-bottom: 8px; }
        .tab-btn { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; }
        .tab-btn.active { background: #1f6feb; color: #fff; border-color: #1f6feb; font-weight: bold; }
        
        .controls { display: flex; gap: 6px; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; }
        select, input { padding: 6px; background: #161b22; color: #c9d1d9; border: 1px solid #30363d; border-radius: 4px; font-size: 11px; }
        
        .table-container { max-height: 60vh; overflow-y: auto; border: 1px solid #30363d; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; background: #161b22; white-space: nowrap; }
        th, td { padding: 8px; text-align: center; border-bottom: 1px solid #30363d; font-size: 11px; }
        th { background-color: #21262d; color: #58a6ff; position: sticky; top: 0; z-index: 5; }
        tr:hover { background-color: #21262d; }
        
        .badge-demand { color: #3fb950; background: rgba(63,185,80,0.1); padding: 2px 4px; border-radius: 3px; font-weight: bold; }
        .badge-supply { color: #f85149; background: rgba(248,81,73,0.1); padding: 2px 4px; border-radius: 3px; font-weight: bold; }
        .chart-btn { background: #238636; color: #fff; text-decoration: none; padding: 3px 6px; border-radius: 3px; font-size: 10px; font-weight: bold; }
        .star { background: none; border: none; color: #8b949e; cursor: pointer; font-size: 14px; }
        .star.active { color: #e3b341; }
    </style>
</head>
<body>

    <div class="header">
        <h2>NSE Multi-Timeframe Demand Zone Screener</h2>
        <div class="admin-badge">Developer & Admin: SHAHNAWAZ MANSURI</div>
        <div class="stats" id="statsText">Loading...</div>
    </div>

    <!-- Timeframe Selection Tabs -->
    <div class="tf-container">
        <button class="tf-btn active" onclick="changeTf('Daily')">Daily</button>
        <button class="tf-btn" onclick="changeTf('Weekly')">Weekly</button>
        <button class="tf-btn" onclick="changeTf('Monthly')">Monthly</button>
        <button class="tf-btn" onclick="changeTf('Quarterly')">Quarterly</button>
        <button class="tf-btn" onclick="changeTf('Half-Yearly')">Half-Yearly</button>
        <button class="tf-btn" onclick="changeTf('Yearly')">Yearly</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="btnAll" onclick="switchTab('ALL')">All Stocks</button>
        <button class="tab-btn" id="btnWl" onclick="switchTab('WL')">⭐ Watchlist (<span id="wlCount">0</span>)</button>
    </div>

    <div class="controls">
        <select id="categoryFilter" onchange="renderTable()">
            <option value="ALL">All Categories</option>
            <option value="Large Cap">Large Cap</option>
            <option value="Mid Cap">Mid Cap</option>
            <option value="Small Cap">Small Cap</option>
            <option value="Micro Cap">Micro Cap</option>
            <option value="Nifty Sharia">Nifty Sharia</option>
        </select>
        <select id="zoneFilter" onchange="renderTable()">
            <option value="ALL">All Zones</option>
            <option value="Demand">Demand Zone</option>
            <option value="Supply">Supply Zone</option>
        </select>
        <select id="patternFilter" onchange="renderTable()">
            <option value="ALL">All Patterns</option>
            <option value="RBR">RBR</option>
            <option value="RBD">RBD</option>
            <option value="DBR">DBR</option>
            <option value="DBD">DBD</option>
        </select>
        <input type="text" id="searchInput" placeholder="Search symbol..." onkeyup="renderTable()">
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>⭐</th>
                    <th>Symbol</th>
                    <th>Category</th>
                    <th>Timeframe</th>
                    <th>Pattern</th>
                    <th>Zone</th>
                    <th>Price</th>
                    <th>Chart</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="8">Loading data...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        let currentTab = 'ALL';
        let currentTf = 'Daily';
        let watchlist = JSON.parse(localStorage.getItem('shahnawaz_watchlist')) || [];

        const stockDatabase = [
            { symbol: "RELIANCE", cat: "Large Cap", isSharia: true, price: 2940.50, tfData: { Daily: {zone:"Demand", pattern:"RBR"}, Weekly: {zone:"Demand", pattern:"DBR"}, Monthly: {zone:"Supply", pattern:"RBD"}, Quarterly: {zone:"Demand", pattern:"RBR"}, "Half-Yearly": {zone:"Supply", pattern:"DBD"}, Yearly: {zone:"Demand", pattern:"RBR"} } },
            { symbol: "TCS", cat: "Large Cap", isSharia: true, price: 4120.00, tfData: { Daily: {zone:"Supply", pattern:"RBD"}, Weekly: {zone:"Supply", pattern:"DBD"}, Monthly: {zone:"Demand", pattern:"RBR"}, Quarterly: {zone:"Supply", pattern:"RBD"}, "Half-Yearly": {zone:"Demand", pattern:"DBR"}, Yearly: {zone:"Supply", pattern:"DBD"} } },
            { symbol: "INFY", cat: "Large Cap", isSharia: true, price: 1850.25, tfData: { Daily: {zone:"Demand", pattern:"DBR"}, Weekly: {zone:"Demand", pattern:"RBR"}, Monthly: {zone:"Demand", pattern:"DBR"}, Quarterly: {zone:"Supply", pattern:"DBD"}, "Half-Yearly": {zone:"Demand", pattern:"RBR"}, Yearly: {zone:"Supply", pattern:"RBD"} } },
            { symbol: "HDFCBANK", cat: "Large Cap", isSharia: false, price: 1630.10, tfData: { Daily: {zone:"Supply", pattern:"DBD"}, Weekly: {zone:"Demand", pattern:"RBR"}, Monthly: {zone:"Supply", pattern:"RBD"}, Quarterly: {zone:"Demand", pattern:"DBR"}, "Half-Yearly": {zone:"Supply", pattern:"DBD"}, Yearly: {zone:"Demand", pattern:"RBR"} } },
            { symbol: "ICICIBANK", cat: "Large Cap", isSharia: false, price: 1150.40, tfData: { Daily: {zone:"Demand", pattern:"RBR"}, Weekly: {zone:"Supply", pattern:"RBD"}, Monthly: {zone:"Demand", pattern:"DBR"}, Quarterly: {zone:"Demand", pattern:"RBR"}, "Half-Yearly": {zone:"Supply", pattern:"RBD"}, Yearly: {zone:"Demand", pattern:"DBR"} } },
            { symbol: "SBIN", cat: "Large Cap", isSharia: false, price: 790.80, tfData: { Daily: {zone:"Demand", pattern:"DBR"}, Weekly: {zone:"Demand", pattern:"RBR"}, Monthly: {zone:"Supply", pattern:"DBD"}, Quarterly: {zone:"Demand", pattern:"RBR"}, "Half-Yearly": {zone:"Supply", pattern:"RBD"}, Yearly: {zone:"Demand", pattern:"DBR"} } },
            { symbol: "ZOMATO", cat: "Mid Cap", isSharia: true, price: 215.30, tfData: { Daily: {zone:"Demand", pattern:"RBR"}, Weekly: {zone:"Supply", pattern:"RBD"}, Monthly: {zone:"Demand", pattern:"DBR"}, Quarterly: {zone:"Demand", pattern:"RBR"}, "Half-Yearly": {zone:"Demand", pattern:"DBR"}, Yearly: {zone:"Supply", pattern:"RBD"} } },
            { symbol: "PAYTM", cat: "Mid Cap", isSharia: false, price: 450.00, tfData: { Daily: {zone:"Supply", pattern:"DBD"}, Weekly: {zone:"Demand", pattern:"DBR"}, Monthly: {zone:"Supply", pattern:"RBD"}, Quarterly: {zone:"Demand", pattern:"RBR"}, "Half-Yearly": {zone:"Supply", pattern:"DBD"}, Yearly: {zone:"Demand", pattern:"DBR"} } },
            { symbol: "SUZLON", cat: "Small Cap", isSharia: true, price: 72.50, tfData: { Daily: {zone:"Demand", pattern:"DBR"}, Weekly: {zone:"Demand", pattern:"RBR"}, Monthly: {zone:"Supply", pattern:"DBD"}, Quarterly: {zone:"Demand", pattern:"RBR"}, "Half-Yearly": {zone:"Supply", pattern:"RBD"}, Yearly: {zone:"Demand", pattern:"DBR"} } },
            { symbol: "RVNL", cat: "Small Cap", isSharia: false, price: 480.00, tfData: { Daily: {zone:"Supply", pattern:"RBD"}, Weekly: {zone:"Demand", pattern:"DBR"}, Monthly: {zone:"Demand", pattern:"RBR"}, Quarterly: {zone:"Supply", pattern:"DBD"}, "Half-Yearly": {zone:"Demand", pattern:"RBR"}, Yearly: {zone:"Supply", pattern:"RBD"} } },
            { symbol: "EASEMYTRIP", cat: "Micro Cap", isSharia: true, price: 35.20, tfData: { Daily: {zone:"Demand", pattern:"RBR"}, Weekly: {zone:"Supply", pattern:"RBD"}, Monthly: {zone:"Demand", pattern:"DBR"}, Quarterly: {zone:"Demand", pattern:"RBR"}, "Half-Yearly": {zone:"Supply", pattern:"DBD"}, Yearly: {zone:"Demand", pattern:"RBR"} } },
            { symbol: "BCG", cat: "Micro Cap", isSharia: false, price: 12.40, tfData: { Daily: {zone:"Supply", pattern:"DBD"}, Weekly: {zone:"Demand", pattern:"DBR"}, Monthly: {zone:"Supply", pattern:"RBD"}, Quarterly: {zone:"Demand", pattern:"RBR"}, "Half-Yearly": {zone:"Supply", pattern:"DBD"}, Yearly: {zone:"Demand", pattern:"DBR"} } }
        ];

        function changeTf(tf) {
            currentTf = tf;
            document.querySelectorAll('.tf-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText === tf);
            });
            renderTable();
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('btnAll').classList.toggle('active', tab === 'ALL');
            document.getElementById('btnWl').classList.toggle('active', tab === 'WL');
            renderTable();
        }

        function toggleWatchlist(sym) {
            if (watchlist.includes(sym)) {
                watchlist = watchlist.filter(s => s !== sym);
            } else {
                watchlist.push(sym);
            }
            localStorage.setItem('shahnawaz_watchlist', JSON.stringify(watchlist));
            renderTable();
        }

        function renderTable() {
            let catVal = document.getElementById('categoryFilter').value;
            let zoneVal = document.getElementById('zoneFilter').value;
            let patternVal = document.getElementById('patternFilter').value;
            let searchVal = document.getElementById('searchInput').value.toUpperCase();
            
            document.getElementById('wlCount').innerText = watchlist.length;

            let filtered = stockDatabase.filter(item => {
                let tfInfo = item.tfData[currentTf];
                let matchesTab = (currentTab === 'ALL' || watchlist.includes(item.symbol));
                let matchesCat = (catVal === 'ALL' || (catVal === 'Nifty Sharia' ? item.isSharia : item.cat === catVal));
                let matchesZone = (zoneVal === 'ALL' || tfInfo.zone === zoneVal);
                let matchesPattern = (patternVal === 'ALL' || tfInfo.pattern === patternVal);
                let matchesSearch = item.symbol.includes(searchVal);
                return matchesTab && matchesCat && matchesZone && matchesPattern && matchesSearch;
            });

            document.getElementById('statsText').innerText = `Timeframe: ${currentTf} | Showing: ${filtered.length} stocks`;

            let tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8">No matching stocks found for ${currentTf}</td></tr>`;
                return;
            }

            filtered.forEach(item => {
                let tfInfo = item.tfData[currentTf];
                let isStarred = watchlist.includes(item.symbol);
                let zoneBadge = tfInfo.zone === 'Demand' 
                    ? `<span class="badge-demand">Demand</span>` 
                    : `<span class="badge-supply">Supply</span>`;
                let tvUrl = `https://in.tradingview.com/chart/?symbol=NSE:${item.symbol}`;

                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><button class="star ${isStarred ? 'active' : ''}" onclick="toggleWatchlist('${item.symbol}')">${isStarred ? '★' : '☆'}</button></td>
                    <td><strong>${item.symbol}</strong></td>
                    <td>${item.cat} ${item.isSharia ? '(Sharia)' : ''}</td>
                    <td style="color: #f0883e; font-weight: bold;">${currentTf}</td>
                    <td style="color: #e3b341; font-weight: bold;">${tfInfo.pattern}</td>
                    <td>${zoneBadge}</td>
                    <td style="color: #58a6ff; font-weight: bold;">₹${item.price}</td>
                    <td><a href="${tvUrl}" target="_blank" class="chart-btn">Chart ↗</a></td>
                `;
                tbody.appendChild(tr);
            });
        }

        renderTable();
    </script>
</body>
</html>
