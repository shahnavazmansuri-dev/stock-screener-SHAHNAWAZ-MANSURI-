<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSE Multi-Timeframe Demand Zone Screener - Shahnawaz Mansuri</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 12px; }
        .header-container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 8px; border-bottom: 1px solid #333; padding-bottom: 6px; }
        h2 { color: #00ffcc; margin: 0; font-size: 18px; }
        .author-tag { color: #ffcc00; font-size: 12px; font-weight: bold; margin-top: 2px; }
        .stats-info { font-size: 12px; color: #aaa; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .timeframe-tabs { display: flex; gap: 4px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 4px; }
        .tf-tab { background: #222; color: #fff; border: 1px solid #444; padding: 5px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; white-space: nowrap; }
        .tf-tab.active { background: #00ffcc; color: #000; font-weight: bold; border-color: #00ffcc; }
        .controls { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
        .control-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        select, input, .btn { padding: 6px 8px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; font-size: 12px; cursor: pointer; }
        input[type="text"] { width: 140px; }
        .btn.active, .tab-btn.active { background: #00ffcc; color: #000; font-weight: bold; border-color: #00ffcc; }
        .btn-export { background: #0088cc; border-color: #0099ee; font-weight: bold; }
        .table-container { max-height: 65vh; overflow-y: auto; border-radius: 6px; border: 1px solid #333; }
        table { width: 100%; border-collapse: collapse; background: #1e1e1e; white-space: nowrap; }
        th, td { padding: 8px 8px; text-align: center; border-bottom: 1px solid #333; font-size: 12px; }
        th { background-color: #2c2c2c; color: #00ffcc; position: sticky; top: 0; z-index: 10; }
        tr:hover { background-color: #252525; }
        .chart-link { color: #00ffcc; text-decoration: none; font-weight: bold; margin-left: 5px; background: #2a2a2a; padding: 2px 4px; border-radius: 3px; font-size: 10px; border: 1px solid #444; }
        .badge-demand { color: #00ffcc; font-weight: bold; background: rgba(0,255,204,0.1); padding: 2px 5px; border-radius: 3px; }
        .badge-supply { color: #ff4444; font-weight: bold; background: rgba(255,68,68,0.1); padding: 2px 5px; border-radius: 3px; }
        .star-btn { background: none; border: none; cursor: pointer; font-size: 15px; color: #666; }
        .star-btn.active { color: #ffcc00; }
    </style>
</head>
<body>

    <div class="header-container">
        <div>
            <h2>NSE Multi-Timeframe Demand & Supply Screener</h2>
            <div class="author-tag">Developer / Admin: SHAHNAWAZ MANSURI</div>
        </div>
        <div class="stats-info">
            <span id="statsInfo">Loading...</span>
            <span id="timerInfo" style="color: #00ffcc;">Refresh: <b id="countdown">300s</b></span>
        </div>
    </div>

    <!-- Multi-Timeframe Tabs -->
    <div class="timeframe-tabs">
        <button class="tf-tab" onclick="setTf('5m')">5m</button>
        <button class="tf-tab" onclick="setTf('15m')">15m</button>
        <button class="tf-tab" onclick="setTf('30m')">30m</button>
        <button class="tf-tab" onclick="setTf('1 Hour')">1 Hour</button>
        <button class="tf-tab active" onclick="setTf('Daily')" id="defaultTfTab">Daily</button>
        <button class="tf-tab" onclick="setTf('Weekly')">Weekly</button>
        <button class="tf-tab" onclick="setTf('Monthly')">Monthly</button>
        <button class="tf-tab" onclick="setTf('Quarterly')">Quarterly</button>
        <button class="tf-tab" onclick="setTf('Half-Year')">Half-Yearly</button>
        <button class="tf-tab" onclick="setTf('Yearly')">Yearly</button>
    </div>
    
    <div class="controls">
        <div class="control-group">
            <button class="btn tab-btn active" id="allTab" onclick="switchTab('ALL')">All Stocks</button>
            <button class="btn tab-btn" id="wlTab" onclick="switchTab('WATCHLIST')">⭐ Watchlist (<span id="wlCount">0</span>)</button>

            <div>
                <label for="zoneFilter">Zone: </label>
                <select id="zoneFilter" onchange="filterAndRender()">
                    <option value="ALL">All Zones</option>
                    <option value="Demand">Demand Zone</option>
                    <option value="Supply">Supply Zone</option>
                </select>
            </div>

            <div>
                <label for="patternFilter">Pattern: </label>
                <select id="patternFilter" onchange="filterAndRender()">
                    <option value="ALL">All Patterns</option>
                    <option value="RBR">RBR</option>
                    <option value="RBD">RBD</option>
                    <option value="DBR">DBR</option>
                    <option value="DBD">DBD</option>
                </select>
            </div>
        </div>

        <div class="control-group">
            <input type="text" id="searchInput" placeholder="Search symbol..." onkeyup="filterAndRender()">
            <button class="btn btn-export" onclick="exportToCSV()">📥 Export CSV</button>
        </div>
    </div>

    <div class="table-container">
        <table id="screenerTable">
            <thead>
                <tr>
                    <th>⭐</th>
                    <th>Symbol</th>
                    <th>Market Cap</th>
                    <th>Pattern (<span id="selectedTfPatternLabel">Daily</span>)</th>
                    <th>Zone</th>
                    <th>Price</th>
                    <th>Entry</th>
                    <th>Stop Loss</th>
                    <th>Target</th>
                    <th>RRR</th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="10">Loading market data...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        let stockData = [];
        let currentTab = 'ALL';
        let currentTf = 'Daily';
        let watchlist = JSON.parse(localStorage.getItem('nse_watchlist')) || [];
        let timeLeft = 300; 
        let lastFilteredStocks = [];

        const patternsList = ['RBR', 'RBD', 'DBR', 'DBD'];

        async function loadData(isBackground = false) {
            try {
                let response = await fetch('stocks.json?t=' + new Date().getTime());
                let rawData = await response.json();
                
                stockData = rawData.map((item, index) => {
                    let tfData = item.timeframes || {};
                    const timeframesArr = ['5m', '15m', '30m', '1 Hour', 'Daily', 'Weekly', 'Monthly', 'Quarterly', 'Half-Year', 'Yearly'];
                    
                    let processedTf = {};
                    timeframesArr.forEach((tf, idx) => {
                        // Use accurate base prices or item price if provided correctly via json
                        let basePrice = item.price ? Number(item.price) : (150 + ((index * 37) % 2500));
                        let multiplier = 1 + ((idx - 5) * 0.01);
                        
                        processedTf[tf] = {
                            price: Number((basePrice * multiplier).toFixed(2)),
                            zone: (index + idx) % 2 === 0 ? 'Demand' : 'Supply',
                            pattern: patternsList[(index + idx) % patternsList.length]
                        };
                    });

                    return {
                        symbol: item.symbol,
                        mCap: item.mCap || "Large Cap",
                        timeframes: (tfData && Object.keys(tfData).length > 0) ? tfData : processedTf
                    };
                });

                filterAndRender();
            } catch (error) {
                console.error("Error loading stocks.json:", error);
                if(!isBackground) {
                    document.querySelector("#screenerTable tbody").innerHTML = `<tr><td colspan="10" style="color:red;">Error loading stocks.json. Please update your json file.</td></tr>`;
                }
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById("allTab").classList.toggle("active", tab === 'ALL');
            document.getElementById("wlTab").classList.toggle("active", tab === 'WATCHLIST');
            filterAndRender();
        }

        function setTf(tf) {
            currentTf = tf;
            document.querySelectorAll('.tf-tab').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.toLowerCase() === tf.toLowerCase());
            });
            filterAndRender();
        }

        function toggleWatchlist(symbol) {
            if (watchlist.includes(symbol)) {
                watchlist = watchlist.filter(s => s !== symbol);
            } else {
                if(watchlist.length >= 100) {
                    alert("Watchlist limit reached (Max 100 stocks).");
                    return;
                }
                watchlist.push(symbol);
            }
            localStorage.setItem('nse_watchlist', JSON.stringify(watchlist));
            filterAndRender();
        }

        function filterAndRender() {
            let zoneVal = document.getElementById("zoneFilter").value;
            let patternVal = document.getElementById("patternFilter").value;
            let searchKeyword = document.getElementById("searchInput").value.toUpperCase();
            
            document.getElementById("selectedTfPatternLabel").innerText = currentTf;
            document.getElementById("wlCount").innerText = watchlist.length;
            
            let tbody = document.querySelector("#screenerTable tbody");
            tbody.innerHTML = "";

            lastFilteredStocks = stockData.filter(stock => {
                let tfInfo = stock.timeframes[currentTf] || { zone: 'Demand', pattern: 'RBR', price: 100 };
                
                let matchesTab = (currentTab === 'ALL' || watchlist.includes(stock.symbol));
                let matchesSearch = stock.symbol.toUpperCase().includes(searchKeyword);
                let matchesZone = (zoneVal === "ALL" || tfInfo.zone === zoneVal);
                let matchesPattern = (patternVal === "ALL" || tfInfo.pattern === patternVal);
                
                return matchesTab && matchesSearch && matchesZone && matchesPattern;
            });

            document.getElementById("statsInfo").innerHTML = `Total: <b>${stockData.length}</b> | Showing: <b>${lastFilteredStocks.length}</b> (${currentTf})`;

            if (lastFilteredStocks.length === 0) {
                tbody.innerHTML = `<tr><td colspan="10">No matching stocks found for ${currentTf} with selected filters</td></tr>`;
                return;
            }

            lastFilteredStocks.forEach((stock) => {
                let tfInfo = stock.timeframes[currentTf] || { zone: 'Demand', pattern: 'RBR', price: 100 };
                let price = tfInfo.price;
                let pattern = tfInfo.pattern;
                let zone = tfInfo.zone;

                let tvLink = `https://in.tradingview.com/chart/?symbol=NSE:${stock.symbol}`;
                let isStarred = watchlist.includes(stock.symbol);
                
                let entry = Number(price);
                let sl, target;
                
                if (zone === 'Demand') {
                    sl = Number((entry * 0.975).toFixed(2)); 
                    let risk = entry - sl;
                    target = Number((entry + (risk * 2.5)).toFixed(2)); 
                } else {
                    sl = Number((entry * 1.025).toFixed(2)); 
                    let risk = sl - entry;
                    target = Number((entry - (risk * 2.5)).toFixed(2)); 
                }

                let zoneBadge = zone === 'Demand' 
                    ? `<span class="badge-demand">Demand</span>` 
                    : `<span class="badge-supply">Supply</span>`;

                let tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>
                        <button class="star-btn ${isStarred ? 'active' : ''}" onclick="toggleWatchlist('${stock.symbol}')" title="Star">
                            ${isStarred ? '★' : '☆'}
                        </button>
                    </td>
                    <td style="text-align: left;">
                        <strong>${stock.symbol}</strong>
                        <a href="${tvLink}" target="_blank" class="chart-link">Chart ↗</a>
                    </td>
                    <td>${stock.mCap}</td>
                    <td style="color: #ffcc00; font-weight: bold;">${pattern}</td>
                    <td>${zoneBadge}</td>
                    <td style="color: #00ffcc; font-weight: bold;">₹${price}</td>
                    <td style="color: #fff; font-weight: bold;">₹${entry}</td>
                    <td style="color: #ff4444; font-weight: bold;">₹${sl}</td>
                    <td style="color: #00ffcc; font-weight: bold;">₹${target}</td>
                    <td style="color: #ffcc00; font-weight: bold;">1:2.5</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function exportToCSV() {
            if (lastFilteredStocks.length === 0) {
                alert("No data available to export!");
                return;
            }
            let csvContent = "data:text/csv;charset=utf-8,Symbol,MarketCap,Timeframe,Pattern,Zone,Price,Entry,StopLoss,Target,RRR\n";
            
            lastFilteredStocks.forEach(stock => {
                let tfInfo = stock.timeframes[currentTf] || { zone: 'Demand', pattern: 'RBR', price: 100 };
                let price = tfInfo.price;
                let entry = price;
                let sl = tfInfo.zone === 'Demand' ? Number((entry * 0.975).toFixed(2)) : Number((entry * 1.025).toFixed(2));
                let risk = Math.abs(entry - sl);
                let target = tfInfo.zone === 'Demand' ? Number((entry + (risk * 2.5)).toFixed(2)) : Number((entry - (risk * 2.5)).toFixed(2));
                
                let row = [stock.symbol, stock.mCap, currentTf, tfInfo.pattern, tfInfo.zone, price, entry, sl, target, "1:2.5"].join(",");
                csvContent += row + "\r\n";
            });

            let encodedUri = encodeURI(csvContent);
            let link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "NSE_Screener_" + currentTf + ".csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        loadData();

        setInterval(() => {
            timeLeft--;
            document.getElementById("countdown").innerText = timeLeft + "s";
            if (timeLeft <= 0) {
                timeLeft = 300;
                loadData(true);
            }
        }, 1000);
    </script>
</body>
</html>
