<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Shahnawaz Mansuri Stock Screener</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:15px;
    background:#101010;
    color:white;
    font-family:Arial,sans-serif;
}

h1{
    text-align:center;
    color:#00ffcc;
    margin:10px 0 20px;
}

h2{
    color:#00ffcc;
    font-size:20px;
}

.container{
    width:100%;
    max-width:1500px;
    margin:auto;
}

.box{
    background:#181818;
    border:1px solid #333;
    border-radius:10px;
    padding:15px;
    margin-bottom:15px;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:15px;
}

input,
select,
button{
    background:#222;
    color:white;
    border:1px solid #444;
    border-radius:6px;
    padding:10px;
    font-size:14px;
}

input{
    min-width:180px;
}

button{
    cursor:pointer;
}

button:hover{
    background:#333;
    color:#00ffcc;
}

.primary{
    background:#005555;
    color:#00ffcc;
}

.demand-btn{
    background:#003d20;
}

.supply-btn{
    background:#3d0000;
}

.status{
    color:#ffcc00;
    font-size:13px;
    margin-top:8px;
}

.good{
    color:#00ff66;
    font-weight:bold;
}

.bad{
    color:#ff5555;
    font-weight:bold;
}

.blue{
    color:#00bfff;
    font-weight:bold;
}

.orange{
    color:#ffaa00;
    font-weight:bold;
}

table{
    width:100%;
    border-collapse:collapse;
    background:#181818;
    margin-top:10px;
}

th{
    background:#292929;
    color:#00ffcc;
    position:sticky;
    top:0;
    z-index:2;
}

th,
td{
    padding:9px;
    border-bottom:1px solid #333;
    text-align:left;
    white-space:nowrap;
    font-size:13px;
}

tr:hover{
    background:#222;
}

.table-wrap{
    overflow:auto;
    max-height:75vh;
}

.tv-link{
    color:#00bfff;
    text-decoration:none;
    font-weight:bold;
}

.tv-link:hover{
    text-decoration:underline;
}

.small{
    font-size:12px;
    color:#aaa;
}

.zone-title{
    color:#00ffcc;
    margin-bottom:10px;
}

.hidden{
    display:none;
}

.calc-result{
    color:#00ff66;
    font-weight:bold;
    margin-top:10px;
    line-height:1.8;
}

.badge{
    display:inline-block;
    padding:4px 7px;
    border-radius:5px;
    font-size:11px;
    font-weight:bold;
}

.badge-demand{
    background:#063;
    color:#00ff88;
}

.badge-supply{
    background:#500;
    color:#ff7777;
}

.badge-score{
    background:#444;
    color:#ffd000;
}

.badge-fresh{
    background:#004466;
    color:#66ddff;
}

@media(max-width:700px){

    body{
        padding:8px;
    }

    h1{
        font-size:20px;
    }

    input,
    select,
    button{
        width:100%;
    }

    th,
    td{
        font-size:12px;
        padding:7px;
    }

}

</style>

</head>


<body>

<div class="container">

<h1>Shahnawaz Mansuri Stock Screener</h1>


<!-- ========================= -->
<!-- RISK REWARD CALCULATOR -->
<!-- ========================= -->

<div class="box">

<h2>Risk-Reward & Target Calculator</h2>

<div class="controls">

<input
type="number"
id="calcEntry"
placeholder="Entry Price ₹">

<input
type="number"
id="calcSL"
placeholder="Stop Loss ₹">

<button onclick="calculateLevels()">
Calculate Targets
</button>

</div>

<div id="calcResult"
class="calc-result">
</div>

</div>


<!-- ========================= -->
<!-- ACTIONS -->
<!-- ========================= -->

<div class="box">

<div class="controls">

<input
type="file"
id="jsonFile"
accept=".json,.csv"
onchange="handleFileUpload(event)">

<button onclick="downloadCSV()">
Download CSV
</button>

<button onclick="showWatchlist()">
⭐ View Watchlist
</button>

<button onclick="showAllStocks()">
📊 All Stocks
</button>

<button
class="primary"
onclick="loadAllData()">
🔄 Refresh Data
</button>

<button
class="primary"
onclick="fetchAllLivePrices()">
💹 Fetch Live Prices
</button>

</div>

<div id="status"
class="status">
Loading data...
</div>

</div>


<!-- ========================= -->
<!-- NORMAL FILTERS -->
<!-- ========================= -->

<div class="box">

<h2>Stock Filters</h2>

<div class="controls">

<input
type="text"
id="searchInput"
placeholder="Search Stock..."
oninput="applyFilters()">


<select
id="categorySelect"
onchange="applyFilters()">

<option value="ALL">
All Categories
</option>

<option value="Large Cap">
Large Cap
</option>

<option value="Mid Cap">
Mid Cap
</option>

<option value="Small Cap">
Small Cap
</option>

<option value="Micro Cap">
Micro Cap
</option>

<option value="Shariah">
Nifty Shariah
</option>

</select>


<select
id="strategySelect"
onchange="applyFilters()">

<option value="ALL">
All Strategies / Zones
</option>

<option value="EMA_CROSS">
9/20 EMA Crossover
</option>

<option value="Demand">
Demand Zone
</option>

<option value="Supply">
Supply Zone
</option>

<option value="Bollinger">
Bollinger Squeeze / Breakout
</option>

<option value="Breakout">
Breakout
</option>

<option value="MACD_CCI">
MACD / CCI Cross
</option>

<option value="Shariah">
Nifty Shariah
</option>

</select>

</div>

</div>


<!-- ========================= -->
<!-- ZONE FILTERS -->
<!-- ========================= -->

<div
class="box"
id="zoneControls">

<h2 class="zone-title">
Demand / Supply Zone Scanner
</h2>

<div class="controls">

<select
id="timeframeSelect"
onchange="applyFilters()">

<option value="ALL">
All Timeframes
</option>

<option value="DAILY">
Daily
</option>

<option value="WEEKLY">
Weekly
</option>

<option value="MONTHLY">
Monthly
</option>

<option value="QUARTERLY">
Quarterly
</option>

<option value="HALF_YEAR">
Half-Year
</option>

<option value="YEARLY">
Yearly
</option>

</select>


<select
id="patternSelect"
onchange="applyFilters()">

<option value="ALL">
All Patterns
</option>

<option value="RBR">
RBR
</option>

<option value="DBR">
DBR
</option>

<option value="RBD">
RBD
</option>

<option value="DBD">
DBD
</option>

</select>


<select
id="scoreSelect"
onchange="applyFilters()">

<option value="0">
Score 0+
</option>

<option value="7">
Score 7+
</option>

<option value="8">
Score 8+
</option>

<option value="9">
Score 9+
</option>

<option value="10">
Score 10
</option>

</select>


<select
id="freshSelect"
onchange="applyFilters()">

<option value="FRESH">
Fresh Only
</option>

<option value="ALL">
Fresh + Old
</option>

</select>

</div>

</div>


<!-- ========================= -->
<!-- TABLE -->
<!-- ========================= -->

<div class="box">

<div class="table-wrap">

<table id="stockTable">

<thead>

<tr>

<th>Stock</th>

<th>Category</th>

<th>Price</th>

<th>Timeframe</th>

<th>Zone</th>

<th>Pattern</th>

<th>Zone High</th>

<th>Zone Low</th>

<th>Score</th>

<th>Distance</th>

<th>Chart</th>

<th>Action</th>

</tr>

</thead>

<tbody>

<tr>

<td colspan="12"
style="text-align:center">

Loading...

</td>

</tr>

</tbody>

</table>

</div>

</div>


</div>


<script>


// =====================================================
// GLOBAL VARIABLES
// =====================================================

let stockData = [];

let zonesData = {};

let watchlist =
JSON.parse(
localStorage.getItem("sm_watchlist") || "[]"
);


// =====================================================
// PAGE LOAD
// =====================================================

document.addEventListener(
"DOMContentLoaded",
function(){

    loadAllData();

});


// =====================================================
// LOAD BOTH JSON FILES
// =====================================================

async function loadAllData(){

    const status =
    document.getElementById("status");

    status.innerText =
    "Loading stocks_data.json and zones_data.json...";

    try{

        const stockResponse =
        await fetch(
            "stocks_data.json?ts=" +
            Date.now()
        );

        if(!stockResponse.ok){
            throw new Error(
                "stocks_data.json not found"
            );
        }

        stockData =
        await stockResponse.json();


        const zoneResponse =
        await fetch(
            "zones_data.json?ts=" +
            Date.now()
        );

        if(zoneResponse.ok){

            const zoneJson =
            await zoneResponse.json();

            zonesData =
            zoneJson.stocks || {};

        }else{

            zonesData = {};

        }


        status.innerText =
        "Data loaded successfully! Stocks: " +
        stockData.length +
        " | Zone stocks: " +
        Object.keys(zonesData).length;


        applyFilters();

    }

    catch(error){

        console.error(error);

        status.innerHTML =
        `<span class="bad">
        Error loading data. Please check JSON files.
        </span>`;

        renderEmpty(
            "Error loading stock/zone data."
        );

    }

}


// =====================================================
// GET SYMBOL
// =====================================================

function getSymbol(stock){

    return String(
        stock.symbol ||
        stock.s ||
        stock.ticker ||
        stock.Stock ||
        stock.name ||
        ""
    ).trim().toUpperCase();

}


// =====================================================
// GET CATEGORY
// =====================================================

function getCategory(stock){

    return String(
        stock.category ||
        stock.c ||
        stock.Category ||
        stock.cap ||
        "-"
    );

}


// =====================================================
// GET PRICE
// =====================================================

function getPrice(stock){

    const values = [

        stock.live_price,
        stock.currentPrice,
        stock.p,
        stock.price,
        stock.ltp,
        stock.close,
        stock.Price

    ];

    for(const value of values){

        const n =
        Number(value);

        if(
            Number.isFinite(n) &&
            n > 0
        ){

            return n;

        }

    }

    return null;

}


// =====================================================
// GET STRATEGY
// =====================================================

function getStrategy(stock){

    return String(
        stock.strategy ||
        stock.strat ||
        stock.Strategy ||
        ""
    );

}


// =====================================================
// NORMAL STOCK TABLE
// =====================================================

function renderNormalTable(data){

    const tbody =
    document.querySelector(
        "#stockTable tbody"
    );

    tbody.innerHTML = "";


    if(
        !data ||
        data.length === 0
    ){

        renderEmpty(
            "No stocks found."
        );

        return;

    }


    data.forEach(stock => {

        const symbol =
        getSymbol(stock);

        const category =
        getCategory(stock);

        const price =
        getPrice(stock);

        const strategy =
        getStrategy(stock);


        const tvUrl =
        "https://in.tradingview.com/chart/?symbol=NSE:" +
        encodeURIComponent(symbol);


        const watched =
        watchlist.includes(symbol);


        const priceText =
        Number.isFinite(price)
        ? "₹" + price.toFixed(2)
        : "-";


        const tr =
        document.createElement("tr");


        tr.innerHTML = `

        <td>
            <strong>${escapeHtml(symbol)}</strong>
        </td>

        <td>
            ${escapeHtml(category)}
        </td>

        <td class="good">
            ${priceText}
        </td>

        <td>-</td>

        <td>-</td>

        <td>-</td>

        <td>-</td>

        <td>-</td>

        <td>-</td>

        <td>-</td>

        <td>
            <a
                class="tv-link"
                href="${tvUrl}"
                target="_blank">
                TV Chart
            </a>
        </td>

        <td>

            <button
                onclick="toggleWatchlist('${escapeAttr(symbol)}')">

                ${
                    watched
                    ? "★ Remove"
                    : "☆ Watch"
                }

            </button>

        </td>

        `;


        tbody.appendChild(tr);

    });

}


// =====================================================
// APPLY FILTERS
// =====================================================

function applyFilters(){

    const search =
    document
    .getElementById("searchInput")
    .value
    .trim()
    .toUpperCase();


    const category =
    document
    .getElementById("categorySelect")
    .value;


    const strategy =
    document
    .getElementById("strategySelect")
    .value;


    if(
        strategy === "Demand" ||
        strategy === "Supply"
    ){

        renderZoneScanner(
            strategy
        );

        return;

    }


    let filtered =
    stockData.filter(stock => {

        const symbol =
        getSymbol(stock);

        const cat =
        getCategory(stock);

        const strat =
        getStrategy(stock);


        const searchMatch =
        !search ||
        symbol.includes(search);


        const categoryMatch =
        category === "ALL" ||
        cat === category;


        let strategyMatch = true;


        if(strategy === "EMA_CROSS"){

            strategyMatch =
            strat.toUpperCase()
            .includes("EMA");

        }


        else if(strategy === "Bollinger"){

            strategyMatch =
            strat.toUpperCase()
            .includes("BOLLINGER");

        }


        else if(strategy === "Breakout"){

            strategyMatch =
            strat.toUpperCase()
            .includes("BREAKOUT");

        }


        else if(strategy === "MACD_CCI"){

            const upper =
            strat.toUpperCase();

            strategyMatch =
            upper.includes("MACD") ||
            upper.includes("CCI");

        }


        else if(strategy === "Shariah"){

            strategyMatch =
            cat === "Shariah" ||
            strat.toUpperCase()
            .includes("SHARIAH");

        }


        return (
            searchMatch &&
            categoryMatch &&
            strategyMatch
        );

    });


    renderNormalTable(filtered);

}


// =====================================================
// ZONE SCANNER
// =====================================================

function renderZoneScanner(zoneType){

    const tbody =
    document.querySelector(
        "#stockTable tbody"
    );

    tbody.innerHTML = "";


    const search =
    document
    .getElementById("searchInput")
    .value
    .trim()
    .toUpperCase();


    const category =
    document
    .getElementById("categorySelect")
    .value;


    const timeframe =
    document
    .getElementById("timeframeSelect")
    .value;


    const pattern =
    document
    .getElementById("patternSelect")
    .value;


    const minScore =
    Number(
        document
        .getElementById("scoreSelect")
        .value
    );


    const freshMode =
    document
    .getElementById("freshSelect")
    .value;


    const results = [];


    Object.keys(zonesData)
    .forEach(symbol => {

        const stockZone =
        zonesData[symbol];

        if(!stockZone) return;


        const stock =
        stockData.find(
            s => getSymbol(s) === symbol
        );


        const cat =
        stock
        ? getCategory(stock)
        : "-";


        const stockPrice =
        stock
        ? getPrice(stock)
        : null;


        const referencePrice =
        Number(
            stockZone.reference_price
        );


        const displayPrice =
        Number.isFinite(referencePrice)
        ? referencePrice
        : stockPrice;


        if(
            category !== "ALL" &&
            cat !== category
        ){

            return;

        }


        if(
            search &&
            !symbol.includes(search)
        ){

            return;

        }


        const timeframes =
        stockZone.timeframes || {};


        Object.keys(timeframes)
        .forEach(tf => {

            if(
                timeframe !== "ALL" &&
                tf !== timeframe
            ){

                return;

            }


            const tfData =
            timeframes[tf] || {};


            const key =
            zoneType === "Demand"
            ? "demand"
            : "supply";


            const zones =
            Array.isArray(tfData[key])
            ? tfData[key]
            : [];


            zones.forEach(zone => {

                const zonePattern =
                String(
                    zone.pattern || ""
                );


                const score =
                Number(
                    zone.score || 0
                );


                const fresh =
                zone.fresh === true;


                if(
                    pattern !== "ALL" &&
                    zonePattern !== pattern
                ){

                    return;

                }


                if(
                    score < minScore
                ){

                    return;

                }


                if(
                    freshMode === "FRESH" &&
                    !fresh
                ){

                    return;

                }


                results.push({

                    symbol,
                    category:cat,
                    price:displayPrice,
                    timeframe:tf,
                    zone:zone,
                    type:zoneType

                });

            });

        });

    });


    // ================================================
    // SORT
    // ================================================

    results.sort((a,b) => {

        const da =
        Number(
            a.zone.distance_percent || 999
        );

        const db =
        Number(
            b.zone.distance_percent || 999
        );


        if(da !== db){

            return da - db;

        }


        return (
            Number(b.zone.score || 0) -
            Number(a.zone.score || 0)
        );

    });


    if(results.length === 0){

        renderEmpty(
            "No matching " +
            zoneType +
            " zones found."
        );

        return;

    }


    results.forEach(item => {

        const z =
        item.zone;


        const tvUrl =
        "https://in.tradingview.com/chart/?symbol=NSE:" +
        encodeURIComponent(item.symbol);


        const watched =
        watchlist.includes(
            item.symbol
        );


        const zoneClass =
        item.type === "Demand"
        ? "badge-demand"
        : "badge-supply";


        const scoreClass =
        "badge-score";


        const freshHtml =
        z.fresh
        ? `<span class="badge badge-fresh">FRESH</span>`
        : "";


        const priceText =
        Number.isFinite(item.price)
        ? "₹" +
          item.price.toFixed(2)
        : "-";


        const tr =
        document.createElement("tr");


        tr.innerHTML = `

        <td>
            <strong>
                ${escapeHtml(item.symbol)}
            </strong>
        </td>

        <td>
            ${escapeHtml(item.category)}
        </td>

        <td class="good">
            ${priceText}
        </td>

        <td>
            <strong>
                ${escapeHtml(item.timeframe)}
            </strong>
        </td>

        <td>
            <span class="badge ${zoneClass}">
                ${escapeHtml(item.type)}
            </span>
        </td>

        <td>
            <strong>
                ${escapeHtml(z.pattern || "-")}
            </strong>
            ${freshHtml}
        </td>

        <td>
            ₹${formatNumber(z.high)}
        </td>

        <td>
            ₹${formatNumber(z.low)}
        </td>

        <td>
            <span class="badge ${scoreClass}">
                ${z.score || 0}/10
            </span>
        </td>

        <td class="orange">
            ${formatNumber(
