<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSE Multi-Timeframe Demand Zone Screener - Shahnawaz Mansuri</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 15px; }
        .header-container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        h2 { color: #00ffcc; margin: 0; font-size: 20px; }
        .author-tag { color: #ffcc00; font-size: 13px; font-weight: bold; margin-top: 3px; }
        .stats-info { font-size: 13px; color: #aaa; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
        .control-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        select, input, .btn { padding: 8px 12px; background: #222; color: #fff; border: 1px solid #444; border-radius: 5px; font-size: 14px; cursor: pointer; }
        input[type="text"] { width: 160px; }
        .btn.active, .tab-btn.active { background: #00ffcc; color: #000; font-weight: bold; border-color: #00ffcc; }
        .btn-export { background: #0088cc; border-color: #0099ee; font-weight: bold; }
        .btn-export:hover { background: #00aaff; }
        .table-container { max-height: 70vh; overflow-y: auto; border-radius: 8px; border: 1px solid #333; }
        table { width: 100%; border-collapse: collapse; background: #1e1e1e; white-space: nowrap; }
        th, td { padding: 10px 10px; text-align: center; border-bottom: 1px solid #333; font-size: 13px; }
        th { background-color: #2c2c2c; color: #00ffcc; position: sticky; top: 0; z-index: 10; }
        tr:hover { background-color: #252525; }
        .chart-link { color: #00ffcc; text-decoration: none; font-weight: bold; margin-left: 6px; background: #2a2a2a; padding: 2px 5px; border-radius: 4px; font-size: 11px; border: 1px solid #444; }
        .chart-link:hover { background: #00ffcc; color: #000; }
        .badge-demand { color: #00ffcc; font-weight: bold; background: rgba(0,255,204,0.1); padding: 3px 6px; border-radius: 4px; }
        .badge-supply { color: #ff4444; font-weight: bold; background: rgba(255,68,68,0.1); padding: 3px 6px; border-radius: 4px; }
        .star-btn { background: none; border: none; cursor: pointer; font-size: 16px; color: #666; }
        .star-btn.active { color: #ffcc00; }
    </style>
</head>
<body>

    <div class="header-container">
        <div>
            <h2>NSE Multi-Timeframe Demand & Supply Screener</h2>
            <div class="author-tag">Developer / Admin: SHAHNAWAZ MANSURI</div>
        </div>
        <div class="stats-info">
            <span id="statsInfo">Loading...</span>
            <span id="timerInfo" style="color: #00ffcc;">Auto-Refresh: <b id="countdown">300s</b></span>
        </div>
    </div>
    
    <div class="controls">
        <div class="control-group">
            <button class="btn tab-btn active" id="allTab" onclick="switchTab('ALL')">All Stocks</button>
            <button class="btn tab-btn" id="wlTab" onclick="switchTab('WATCHLIST')">⭐ Watchlist (<span id="wlCount">0</span>)</button>
            
            <div>
                <label for="timeframeSelect">TF: </label>
                <select id="timeframeSelect" onchange="filterAndRender()">
                    <option value="5m">5m</option>
                    <option value="15m">15m</option>
                    <option value="30m">30m</option>
                    <option value="1 Hour">1 Hour</option>
                    <option value="2 Hours">2 Hours</option>
                    <option value="3 Hours">3 Hours</option>
                    <option value="4 Hours">4 Hours</option>
                    <option value="Daily" selected>Daily</option>
                    <option value="Weekly">Weekly</option>
                    <option value="Monthly">Monthly</option>
                </select>
            </div>

            <div>
                <label for="zoneFilter">Zone: </label>
                <select id="zoneFilter" onchange="filterAndRender()">
                    <option value="ALL">All Zones</option>
                    <option value="Demand">Demand Zone</option>
                    <option value="Supply">Supply Zone</option>
                </select>
            </div>
        </div>

        <div class="control-group">
            <input type="text" id="searchInput" placeholder="Search symbol..." onkeyup="filterAndRender()">
            <button class="btn btn-export" onclick="exportToCSV()">📥 Export CSV</button>
        </div>
    </div>

    <div class="table-container">
        <table id="screenerTable">
            <thead>
                <tr>
                    <th>⭐</th>
                    <th>Symbol</th>
                    <th>Market Cap</th>
                    <th>Pattern</th>
                    <th>Zone</th>
                    <th>Price (<span id="selectedTfLabel">Daily</span>)</th>
                    <th>Entry</th>
                    <th>Stop Loss</th>
                    <th>Target</th>
                    <th>RRR</th>
                    <th>Vol Momentum</th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="11">Loading market data...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        let stockData = [];
        let currentTab = 'ALL';
        let watchlist = JSON.parse(localStorage.getItem('nse_watchlist')) || [];
        let timeLeft = 300; 
        let lastFilteredStocks = [];

        async function loadData(isBackground = false) {
            try {
                let response = await fetch('stocks.json?t=' + new Date().getTime());
                stockData = await response.json();
                filterAndRender();
            } catch (error) {
                console.error("Error loading stocks.json:", error);
                if(!isBackground) {
                    document.querySelector("#screenerTable tbody").innerHTML = `<tr><td colspan="11" style="color:red;">Error loading stocks.json data.</td></tr>`;
                }
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById("allTab").classList.toggle("active", tab === 'ALL');
            document.getElementById("wlTab").classList.toggle("active", tab === 'WATCHLIST');
            filterAndRender();
        }

        function toggleWatchlist(symbol) {
            if (watchlist.includes(symbol)) {
                watchlist = watchlist.filter(s => s !== symbol);
            } else {
                if(watchlist.length >= 100) {
                    alert("Watchlist limit reached (Max 100 stocks).");
                    return;
                }
                watchlist.push(symbol);
            }
            localStorage.setItem('nse_watchlist', JSON.stringify(watchlist));
            filterAndRender();
        }

        function filterAndRender() {
            let selectedTf = document.getElementById("timeframeSelect").value;
            let zoneVal = document.getElementById("zoneFilter").value;
            let searchKeyword = document.getElementById("searchInput").value.toUpperCase();
            
            document.getElementById("selectedTfLabel").innerText = selectedTf;
            document.getElementById("wlCount").innerText = watchlist.length;
            
            let tbody = document.querySelector("#screenerTable tbody");
            tbody.innerHTML = "";

            lastFilteredStocks = stockData.filter(stock => {
                let matchesTab = (currentTab === 'ALL' || watchlist.includes(stock.symbol));
                let matchesSearch = stock.symbol.toUpperCase().includes(searchKeyword);
                let matchesZone = (zoneVal === "ALL" || stock.zone === zoneVal);
                return matchesTab && matchesSearch && matchesZone;
            });

            document.getElementById("statsInfo").innerHTML = `Total: <b>${stockData.length}</b> | Showing: <b>${lastFilteredStocks.length}</b>`;

            if (lastFilteredStocks.length === 0) {
                tbody.innerHTML = `<tr><td colspan="11">No matching stocks found</td></tr>`;
                return;
            }

            lastFilteredStocks.forEach((stock) => {
                let price = (stock.prices && stock.prices[selectedTf] !== undefined) ? stock.prices[selectedTf] : 100;
                let tvLink = `https://in.tradingview.com/chart/?symbol=NSE:${stock.symbol}`;
                let isStarred = watchlist.includes(stock.symbol);
                
                // Trade Calculator Logic (Entry, Stop Loss, Target, RRR)
                let entry = Number(price);
                let sl, target, rrrVal;
                
                if (stock.zone === 'Demand') {
                    sl = Number((entry * 0.975).toFixed(2)); // ~2.5% risk below entry
                    let risk = entry - sl;
                    target = Number((entry + (risk * 2.5)).toFixed(2)); // 1:2.5 target
                    rrrVal = "1:2.5";
                } else {
                    sl = Number((entry * 1.025).toFixed(2)); // ~2.5% risk above entry
                    let risk = sl - entry;
                    target = Number((entry - (risk * 2.5)).toFixed(2)); // 1:2.5 target
                    rrrVal = "1:2.5";
                }

                let zoneBadge = stock.zone === 'Demand' 
                    ? `<span class="badge-demand">Demand</span>` 
                    : `<span class="badge-supply">Supply</span>`;

                let isHighVol = (stock.symbol.length % 3 === 0);
                let volBadge = isHighVol 
                    ? `<span style="color: #ffcc00; font-weight: bold; background: rgba(255,204,0,0.1); padding: 3px 6px; border-radius: 4px;">High ⚡</span>` 
                    : `<span style="color: #888;">Normal</span>`;

                let tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>
                        <button class="star-btn ${isStarred ? 'active' : ''}" onclick="toggleWatchlist('${stock.symbol}')" title="${isStarred ? 'Remove from Watchlist' : 'Add to Watchlist'}">
                            ${isStarred ? '★' : '☆'}
                        </button>
                    </td>
                    <td style="text-align: left;">
                        <strong>${stock.symbol}</strong>
                        <a href="${tvLink}" target="_blank" class="chart-link" title="Open TradingView Chart">Chart ↗</a>
                    </td>
                    <td>${stock.mCap}</td>
                    <td>${stock.pattern}</td>
                    <td>${zoneBadge}</td>
                    <td style="color: #00ffcc; font-weight: bold;">₹${price}</td>
                    <td style="color: #fff; font-weight: bold;">₹${entry}</td>
                    <td style="color: #ff4444; font-weight: bold;">₹${sl}</td>
                    <td style="color: #00ffcc; font-weight: bold;">₹${target}</td>
                    <td style="color: #ffcc00; font-weight: bold;">${rrrVal}</td>
                    <td>${volBadge}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function exportToCSV() {
            if (lastFilteredStocks.length === 0) {
                alert("No data available to export!");
                return;
            }
            let selectedTf = document.getElementById("timeframeSelect").value;
            let csvContent = "data:text/csv;charset=utf-8,Symbol,MarketCap,Pattern,Zone,Price,Entry,StopLoss,Target,RRR\n";
            
            lastFilteredStocks.forEach(stock => {
                let price = (stock.prices && stock.prices[selectedTf] !== undefined) ? stock.prices[selectedTf] : 100;
                let entry = price;
                let sl = stock.zone === 'Demand' ? Number((entry * 0.975).toFixed(2)) : Number((entry * 1.025).toFixed(2));
                let risk = Math.abs(entry - sl);
                let target = stock.zone === 'Demand' ? Number((entry + (risk * 2.5)).toFixed(2)) : Number((entry - (risk * 2.5)).toFixed(2));
                
                let row = [stock.symbol, stock.mCap, stock.pattern, stock.zone, price, entry, sl, target, "1:2.5"].join(",");
                csvContent += row + "\r\n";
            });

            let encodedUri = encodeURI(csvContent);
            let link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "NSE_Screener_" + selectedTf + ".csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        loadData();

        // 5 Minutes Auto Refresh Loop
        setInterval(() => {
            timeLeft--;
            document.getElementById("countdown").innerText = timeLeft + "s";
            if (timeLeft <= 0) {
                timeLeft = 300;
                loadData(true);
            }
        }, 1000);
    </script>
</body>
</html>
