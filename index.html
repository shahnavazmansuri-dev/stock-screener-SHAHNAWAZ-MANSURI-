<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Shahnawaz Mansuri Stock Screener</title>

<style>

body {
    font-family: Arial, sans-serif;
    background-color: #121212;
    color: #fff;
    padding: 15px;
    margin: 0;
}

h2 {
    text-align: center;
    color: #00ffcc;
}

.controls,
.actions-bar,
.zone-controls {
    display: flex;
    justify-content: space-between;
    margin-bottom: 15px;
    flex-wrap: wrap;
    gap: 10px;
}

select,
input,
button {
    padding: 8px;
    background: #222;
    color: #fff;
    border: 1px solid #444;
    border-radius: 4px;
    cursor: pointer;
}

button:hover {
    background: #333;
    color: #00ffcc;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: #1e1e1e;
    margin-top: 10px;
}

th,
td {
    padding: 10px;
    text-align: left;
    border-bottom: 1px solid #333;
    font-size: 14px;
}

th {
    background-color: #333;
    color: #00ffcc;
}

.green {
    color: #00ff66;
    font-weight: bold;
}

.red {
    color: #ff5555;
    font-weight: bold;
}

.yellow {
    color: #ffcc00;
    font-weight: bold;
}

.blue {
    color: #00bcd4;
    font-weight: bold;
}

.tv-link {
    color: #00bcd4;
    text-decoration: none;
    font-weight: bold;
}

.tv-link:hover {
    text-decoration: underline;
}

.calc-box {
    background: #1a1a1a;
    padding: 15px;
    border: 1px solid #333;
    border-radius: 6px;
    margin-bottom: 20px;
}

.calc-box h3 {
    color: #00ffcc;
    margin-top: 0;
    font-size: 16px;
}

.calc-inputs {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
}

#liveStatus {
    color: #ffbb00;
    font-size: 13px;
    font-weight: bold;
}

#zoneStatus {
    color: #00ffcc;
    font-size: 13px;
    font-weight: bold;
}

.zone-panel {
    background: #181818;
    border: 1px solid #333;
    padding: 12px;
    border-radius: 6px;
    margin-bottom: 15px;
}

.zone-title {
    color: #00ffcc;
    font-weight: bold;
    margin-bottom: 10px;
}

.badge {
    display: inline-block;
    padding: 4px 7px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: bold;
}

.badge-demand {
    background: #064d2b;
    color: #00ff66;
}

.badge-supply {
    background: #5a1111;
    color: #ff6666;
}

.badge-fresh {
    background: #07505a;
    color: #00ffff;
}

.badge-score {
    background: #594900;
    color: #ffdd55;
}

@media (max-width: 700px) {

    table {
        font-size: 12px;
    }

    th,
    td {
        padding: 7px;
        font-size: 12px;
    }

    body {
        padding: 8px;
    }

}

</style>

</head>

<body>

<h2>Shahnawaz Mansuri Stock Screener</h2>


<!-- ========================================= -->
<!-- RISK REWARD CALCULATOR -->
<!-- ========================================= -->

<div class="calc-box">

<h3>Risk-Reward & Target Calculator</h3>

<div class="calc-inputs">

<input
    type="number"
    id="calcEntry"
    placeholder="Entry Price (₹)"
    style="width:140px;"
>

<input
    type="number"
    id="calcSL"
    placeholder="Stop Loss (₹)"
    style="width:140px;"
>

<button onclick="calculateLevels()">
Calculate Targets
</button>

<span
    id="calcResult"
    style="color:#00ff66;font-weight:bold;"
></span>

</div>

</div>


<!-- ========================================= -->
<!-- ACTIONS -->
<!-- ========================================= -->

<div class="actions-bar">

<input
    type="file"
    id="jsonFile"
    accept=".json,.csv"
    onchange="handleFileUpload(event)"
>

<button onclick="downloadCSV()">
Download CSV
</button>

<button onclick="showWatchlist()">
View Watchlist
</button>

<button onclick="showAllStocks()">
All Stocks
</button>

<button
    onclick="loadAllData()"
    style="background:#005555;color:#00ffcc;"
>
🔄 Refresh Data
</button>

<span id="liveStatus"></span>

<span id="zoneStatus"></span>

</div>


<!-- ========================================= -->
<!-- NORMAL STOCK FILTERS -->
<!-- ========================================= -->

<div class="controls">

<input
    type="text"
    id="searchInput"
    placeholder="Search Stock..."
    onkeyup="applyFilters()"
>

<select
    id="categorySelect"
    onchange="applyFilters()"
>

<option value="ALL">
All Categories
</option>

<option value="Large Cap">
Large Cap
</option>

<option value="Mid Cap">
Mid Cap
</option>

<option value="Small Cap">
Small Cap
</option>

<option value="Micro Cap">
Micro Cap
</option>

<option value="Shariah">
Nifty Shariah
</option>

</select>


<select
    id="strategySelect"
    onchange="applyFilters()"
>

<option value="ALL">
All Strategies / Zones
</option>

<option value="EMA_CROSS">
9/20 EMA Crossover
</option>

<option value="DEMAND">
Demand Zone
</option>

<option value="SUPPLY">
Supply Zone
</option>

<option value="Bollinger">
Bollinger Squeeze / Breakout
</option>

<option value="MACD_CCI">
MACD / CCI Cross
</option>

</select>

</div>


<!-- ========================================= -->
<!-- ZONE FILTERS -->
<!-- ========================================= -->

<div class="zone-panel">

<div class="zone-title">
Demand / Supply Zone Scanner
</div>

<div class="zone-controls">

<select
    id="timeframeSelect"
    onchange="applyFilters()"
>

<option value="ALL">
All Timeframes
</option>

<option value="DAILY">
Daily
</option>

<option value="WEEKLY">
Weekly
</option>

<option value="MONTHLY">
Monthly
</option>

<option value="QUARTERLY">
Quarterly
</option>

<option value="HALF_YEAR">
Half-Year
</option>

<option value="YEARLY">
Yearly
</option>

</select>


<select
    id="patternSelect"
    onchange="applyFilters()"
>

<option value="ALL">
All Patterns
</option>

<option value="RBR">
RBR
</option>

<option value="DBR">
DBR
</option>

<option value="RBD">
RBD
</option>

<option value="DBD">
DBD
</option>

</select>


<select
    id="scoreSelect"
    onchange="applyFilters()"
>

<option value="7">
Score 7+
</option>

<option value="8">
Score 8+
</option>

<option value="9">
Score 9+
</option>

<option value="10">
Score 10
</option>

</select>

</div>

</div>


<!-- ========================================= -->
<!-- STOCK TABLE -->
<!-- ========================================= -->

<table id="stockTable">

<thead>

<tr>

<th>Stock</th>

<th>Category</th>

<th>Price</th>

<th>Timeframe</th>

<th>Zone</th>

<th>Pattern</th>

<th>Zone High</th>

<th>Zone Low</th>

<th>Score</th>

<th>Distance</th>

<th>Chart</th>

<th>Action</th>

</tr>

</thead>

<tbody>
</tbody>

</table>


<script>


// =========================================
// GLOBAL DATA
// =========================================

let stockData = [];

let zonesData = {};

let currentRows = [];

let watchlist =
    JSON.parse(
        localStorage.getItem("sm_watchlist")
    ) || [];


// =========================================
// LOAD ALL DATA
// =========================================

function loadAllData() {

    const status =
        document.getElementById(
            "liveStatus"
        );

    const zoneStatus =
        document.getElementById(
            "zoneStatus"
        );

    status.innerText =
        "Loading stock data...";

    zoneStatus.innerText =
        "Loading zones...";


    Promise.all([

        fetch(
            "stocks_data.json?t=" +
            Date.now()
        ).then(response => {

            if (!response.ok) {

                throw new Error(
                    "stocks_data.json failed"
                );

            }

            return response.json();

        }),

        fetch(
            "zones_data.json?t=" +
            Date.now()
        ).then(response => {

            if (!response.ok) {

                throw new Error(
                    "zones_data.json failed"
                );

            }

            return response.json();

        })

    ])

    .then(([stocks, zones]) => {

        // STOCK DATA

        if (Array.isArray(stocks)) {

            stockData = stocks;

        } else {

            stockData =
                stocks.stocks || [];

        }


        // ZONE DATA

        zonesData =
            zones.stocks || {};


        status.innerText =
            "Stock data loaded ✅";

        zoneStatus.innerText =
            "Zone data loaded ✅";


        applyFilters();


        setTimeout(() => {

            status.innerText = "";
            zoneStatus.innerText = "";

        }, 4000);

    })

    .catch(error => {

        console.error(error);

        status.innerText =
            "Data loading failed ❌";

        zoneStatus.innerText =
            error.message;

    });

}


// =========================================
// PAGE LOAD
// =========================================

loadAllData();


// =========================================
// GET STOCK SYMBOL
// =========================================

function getSymbol(stock) {

    return (
        stock.s ||
        stock.symbol ||
        stock.Stock ||
        stock.name ||
        ""
    );

}


// =========================================
// GET CATEGORY
// =========================================

function getCategory(stock) {

    return (
        stock.c ||
        stock.category ||
        stock.Category ||
        "-"
    );

}


// =========================================
// GET PRICE
// =========================================

function getPrice(stock) {

    return (
        stock.p ??
        stock.live_price ??
        stock.currentPrice?.NSE ??
        stock.price ??
        stock.Price ??
        stock.ltp ??
        stock.close ??
        0
    );

}


// =========================================
// NORMAL STOCK STRATEGY
// =========================================

function getStrategy(stock) {

    return (
        stock.strat ||
        stock.strategy ||
        stock.Strategy ||
        ""
    );

}


// =========================================
// IS ZONE MODE
// =========================================

function isZoneMode() {

    const strategy =
        document.getElementById(
            "strategySelect"
        ).value;

    return (
        strategy === "DEMAND" ||
        strategy === "SUPPLY"
    );

}


// =========================================
// APPLY FILTERS
// =========================================

function applyFilters() {

    if (isZoneMode()) {

        renderZoneScanner();

        return;

    }


    const search =
        document.getElementById(
            "searchInput"
        ).value
        .trim()
        .toUpperCase();


    const category =
        document.getElementById(
            "categorySelect"
        ).value;


    const strategy =
        document.getElementById(
            "strategySelect"
        ).value;


    let filtered =
        stockData.filter(stock => {

            const symbol =
                getSymbol(stock)
                .toUpperCase();


            const cat =
                getCategory(stock);


            const strat =
                getStrategy(stock);


            const matchesSearch =
                symbol.includes(search);


            const matchesCategory =
                category === "ALL" ||
                cat === category;


            let matchesStrategy = true;


            if (
                strategy === "EMA_CROSS"
            ) {

                matchesStrategy =
                    strat.includes("9/20");

            }

            else if (
                strategy === "Bollinger"
            ) {

                matchesStrategy =
                    strat.includes(
                        "Bollinger"
                    );

            }

            else if (
                strategy === "MACD_CCI"
            ) {

                matchesStrategy =
                    strat.includes("MACD");

            }


            return (
                matchesSearch &&
                matchesCategory &&
                matchesStrategy
            );

        });


    renderNormalTable(filtered);

}


// =========================================
// ZONE SCANNER
// =========================================

function renderZoneScanner() {

    const tbody =
        document.querySelector(
            "#stockTable tbody"
        );

    tbody.innerHTML = "";


    const search =
        document.getElementById(
            "searchInput"
        ).value
        .trim()
        .toUpperCase();


    const category =
        document.getElementById(
            "categorySelect"
        ).value;


    const strategy =
        document.getElementById(
            "strategySelect"
        ).value;


    const timeframe =
        document.getElementById(
            "timeframeSelect"
        ).value;


    const pattern =
        document.getElementById(
            "patternSelect"
        ).value;


    const minimumScore =
        parseInt(
            document.getElementById(
                "scoreSelect"
            ).value
        );


    let rows = [];


    Object.keys(zonesData).forEach(
        symbol => {

            const stock =
                stockData.find(
                    s =>
                        getSymbol(s)
                        .toUpperCase()
                        === symbol.toUpperCase()
                );


            const categoryValue =
                stock
                ? getCategory(stock)
                : "-";


            const price =
                stock
                ? getPrice(stock)
                : (
                    zonesData[symbol]
                    .reference_price || 0
                );


            if (
                search &&
                !symbol
                    .toUpperCase()
                    .includes(search)
            ) {

                return;

            }


            if (
                category !== "ALL" &&
                categoryValue !== category
            ) {

                return;

            }


            const stockZones =
                zonesData[symbol]
                .timeframes || {};


            const timeframeList =
                timeframe === "ALL"
                ? Object.keys(stockZones)
                : [timeframe];


            timeframeList.forEach(tf => {

                if (
                    !stockZones[tf]
                ) {

                    return;

                }


                let zoneList = [];


                if (
                    strategy === "DEMAND"
                ) {

                    zoneList =
                        stockZones[tf]
                        .demand || [];

                }

                else if (
                    strategy === "SUPPLY"
                ) {

                    zoneList =
                        stockZones[tf]
                        .supply || [];

                }


                zoneList.forEach(zone => {

                    if (
                        zone.score <
                        minimumScore
                    ) {

                        return;

                    }


                    if (
                        zone.fresh !== true
                    ) {

                        return;

                    }


                    if (
                        pattern !== "ALL" &&
                        zone.pattern !== pattern
                    ) {

                        return;

                    }


                    rows.push({

                        symbol:
                            symbol,

                        category:
                            categoryValue,

                        price:
                            price,

                        timeframe:
                            tf,

                        zone:
                            zone,

                    });

                });

            });

        }
    );


    // =====================================
    // SORT
    // nearest distance first
    // =====================================

    rows.sort(
        (a, b) => {

            const da =
                a.zone.distance_percent ??
                999;

            const db =
                b.zone.distance_percent ??
                999;

            if (da !== db) {

                return da - db;

            }

            return (
                b.zone.score -
                a.zone.score
            );

        }
    );


    currentRows = rows;


    if (rows.length === 0) {

        tbody.innerHTML =

            `<tr>
                <td colspan="12"
                    style="text-align:center;color:#ff5555;">
                    No Fresh Score 7+ Zones Found
                </td>
            </tr>`;

        return;

    }


    rows.forEach(row => {

        const z =
            row.zone;


        const isWatched =
            watchlist.includes(
                row.symbol
            );


        const priceText =
            Number.isFinite(
                Number(row.price)
            )
            ? "₹" +
              Number(row.price)
              .toFixed(2)
            : "-";


        const distance =
            z.distance_percent !==
            undefined
            ? z.distance_percent
              .toFixed(2) + "%"
            : "-";


        const zoneBadge =
            z.type === "DEMAND"
            ? `<span class="badge badge-demand">
                DEMAND
               </span>`
            : `<span class="badge badge-supply">
                SUPPLY
               </span>`;


        const scoreBadge =
            `<span class="badge badge-score">
                ${z.score}/10
             </span>`;


        const tvUrl =
            "https://in.tradingview.com/chart/?symbol=NSE:" +
            row.symbol;


        const tr =
            document.createElement("tr");


        tr.innerHTML = `

            <td>
                <strong>
                    ${row.symbol}
                </strong>
            </td>

            <td>
                ${row.category}
            </td>

            <td class="green">
                ${priceText}
            </td>

            <td>
                <strong>
                    ${formatTimeframe(
                        row.timeframe
                    )}
                </strong>
            </td>

            <td>
                ${zoneBadge}
                <br>
                <small>
                    ${z.low} -
                    ${z.high}
                </small>
            </td>

            <td>
                <strong>
                    ${z.pattern}
                </strong>
            </td>

            <td>
                ₹${Number(z.high).toFixed(2)}
            </td>

            <td>
                ₹${Number(z.low).toFixed(2)}
            </td>

            <td>
                ${scoreBadge}
            </td>

            <td class="blue">
                ${distance}
            </td>

            <td>
                <a
                    href="${tvUrl}"
                    target="_blank"
                    class="tv-link"
                >
                    TV Chart
                </a>
            </td>

            <td>

                <button
                    onclick="toggleWatchlist(
                        '${row.symbol}'
                    )"
                >
                    ${
                        isWatched
                        ? "★ Remove"
                        : "☆ Watch"
                    }
                </button>

            </td>
        `;


        tbody.appendChild(tr);

    });

}


// =========================================
// TIMEFRAME NAME
// =========================================

function formatTimeframe(tf) {

    const names = {

        DAILY: "Daily",

        WEEKLY: "Weekly",

        MONTHLY: "Monthly",

        QUARTERLY: "Quarterly",

        HALF_YEAR: "Half-Year",

        YEARLY: "Yearly"

    };


    return (
        names[tf] ||
        tf
    );

}


// =============================
