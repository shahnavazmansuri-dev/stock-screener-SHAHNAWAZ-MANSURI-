<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSE Multi-Timeframe Hybrid Screener - Shahnawaz Mansuri</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0d1117; color: #c9d1d9; margin: 0; padding: 10px; }
        .header { text-align: center; border-bottom: 1px solid #30363d; padding-bottom: 8px; margin-bottom: 10px; }
        h2 { color: #58a6ff; margin: 0 0 4px 0; font-size: 16px; }
        .admin-badge { color: #f0883e; font-size: 11px; font-weight: bold; }
        .stats { font-size: 11px; color: #8b949e; margin-top: 4px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .live-tag { color: #3fb950; font-weight: bold; animation: blink 1.5s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        
        .tf-container { display: flex; gap: 4px; justify-content: center; margin-bottom: 8px; flex-wrap: wrap; }
        .tf-btn { background: #161b22; color: #8b949e; border: 1px solid #30363d; padding: 5px 9px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: bold; }
        .tf-btn.active { background: #238636; color: #fff; border-color: #238636; }

        .tabs { display: flex; gap: 6px; justify-content: center; margin-bottom: 8px; }
        .tab-btn { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; }
        .tab-btn.active { background: #1f6feb; color: #fff; border-color: #1f6feb; font-weight: bold; }
        
        .controls { display: flex; gap: 6px; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; }
        select, input { padding: 6px; background: #161b22; color: #c9d1d9; border: 1px solid #30363d; border-radius: 4px; font-size: 11px; }
        
        .table-container { max-height: 60vh; overflow-y: auto; border: 1px solid #30363d; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; background: #161b22; white-space: nowrap; }
        th, td { padding: 8px; text-align: center; border-bottom: 1px solid #30363d; font-size: 11px; }
        th { background-color: #21262d; color: #58a6ff; position: sticky; top: 0; z-index: 5; }
        tr:hover { background-color: #21262d; }
        
        .badge-demand { color: #3fb950; background: rgba(63,185,80,0.1); padding: 2px 4px; border-radius: 3px; font-weight: bold; }
        .badge-supply { color: #f85149; background: rgba(248,81,73,0.1); padding: 2px 4px; border-radius: 3px; font-weight: bold; }
        .chart-btn { background: #238636; color: #fff; text-decoration: none; padding: 3px 6px; border-radius: 3px; font-size: 10px; font-weight: bold; }
        .star { background: none; border: none; color: #8b949e; cursor: pointer; font-size: 14px; }
        .star.active { color: #e3b341; }
        .price-up { color: #3fb950 !important; }
        .price-down { color: #f85149 !important; }
    </style>
</head>
<body>

    <div class="header">
        <h2>NSE Multi-Timeframe Demand & Supply Screener</h2>
        <div class="admin-badge">Developer & Admin: SHAHNAWAZ MANSURI</div>
        <div class="stats">
            <span class="live-tag">● Watchlist: Live Ticking Feed</span>
            <span id="bgStats" style="color: #8b949e;">● Other Stocks: 15-Min Scan Cycle Active</span>
        </div>
    </div>

    <!-- Multi-Timeframe Selection Engine -->
    <div class="tf-container">
        <button class="tf-btn active" onclick="changeTf('Daily')">Daily</button>
        <button class="tf-btn" onclick="changeTf('Weekly')">Weekly</button>
        <button class="tf-btn" onclick="changeTf('Monthly')">Monthly</button>
        <button class="tf-btn" onclick="changeTf('Quarterly')">Quarterly</button>
        <button class="tf-btn" onclick="changeTf('Half-Yearly')">Half-Yearly</button>
        <button class="tf-btn" onclick="changeTf('Yearly')">Yearly</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="btnAll" onclick="switchTab('ALL')">All Stocks</button>
        <button class="tab-btn" id="btnWl" onclick="switchTab('WL')">⭐ Watchlist (<span id="wlCount">0</span>)</button>
    </div>

    <div class="controls">
        <select id="categoryFilter" onchange="renderTable()">
            <option value="ALL">All Categories</option>
            <option value="Large Cap">Large Cap</option>
            <option value="Mid Cap">Mid Cap</option>
            <option value="Small Cap">Small Cap</option>
            <option value="Micro Cap">Micro Cap</option>
            <option value="Nifty Sharia">Nifty Sharia Stocks</option>
        </select>
        <select id="zoneFilter" onchange="renderTable()">
            <option value="ALL">All Zones</option>
            <option value="Demand">Demand Zone</option>
            <option value="Supply">Supply Zone</option>
        </select>
        <select id="patternFilter" onchange="renderTable()">
            <option value="ALL">All Patterns</option>
            <option value="RBR">RBR</option>
            <option value="RBD">RBD</option>
            <option value="DBR">DBR</option>
            <option value="DBD">DBD</option>
        </select>
        <input type="text" id="searchInput" placeholder="Search symbol..." onkeyup="renderTable()">
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>⭐</th>
                    <th>Symbol</th>
                    <th>Category</th>
                    <th>Timeframe</th>
                    <th>Pattern</th>
                    <th>Zone</th>
                    <th>Live Price (₹)</th>
                    <th>Chart</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="8">Initializing Multi-TF Engine...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        let currentTab = 'ALL';
        let currentTf = 'Daily';
        let watchlist = JSON.parse(localStorage.getItem('shahnawaz_watchlist')) || [];

        const rawStocks = [
            { s: "RELIANCE", c: "Large Cap", sh: true, p: 2940 },
            { s: "TCS", c: "Large Cap", sh: true, p: 4120 },
            { s: "HDFCBANK", c: "Large Cap", sh: false, p: 1630 },
            { s: "ICICIBANK", c: "Large Cap", sh: false, p: 1150 },
            { s: "INFY", c: "Large Cap", sh: true, p: 1850 },
            { s: "SBIN", c: "Large Cap", sh: false, p: 790 },
            { s: "BHARTIARTL", c: "Large Cap", sh: true, p: 1420 },
            { s: "ITC", c: "Large Cap", sh: false, p: 450 },
            { s: "LT", c: "Large Cap", sh: false, p: 3560 },
            { s: "SUNPHARMA", c: "Large Cap", sh: true, p: 1680 },
            { s: "AXISBANK", c: "Large Cap", sh: false, p: 1120 },
            { s: "KOTAKBANK", c: "Large Cap", sh: false, p: 1750 },
            { s: "WIPRO", c: "Large Cap", sh: true, p: 540 },
            { s: "TITAN", c: "Large Cap", sh: false, p: 3450 },
            { s: "BAJFINANCE", c: "Large Cap", sh: false, p: 7100 },
            { s: "MARUTI", c: "Large Cap", sh: false, p: 12500 },
            { s: "ULTRACEMCO", c: "Large Cap", sh: false, p: 11200 },
            { s: "POWERGRID", c: "Large Cap", sh: true, p: 330 },
            { s: "NTPC", c: "Large Cap", sh: true, p: 380 },
            { s: "ASIANPAINT", c: "Large Cap", sh: false, p: 2850 },
            { s: "TATAMOTORS", c: "Large Cap", sh: true, p: 980 },
            { s: "TATASTEEL", c: "Large Cap", sh: true, p: 160 },
            { s: "JSWSTEEL", c: "Large Cap", sh: true, p: 920 },
            { s: "GRASIM", c: "Large Cap", sh: false, p: 2600 },
            { s: "HCLTECH", c: "Large Cap", sh: true, p: 1780 },
            { s: "TECHM", c: "Large Cap", sh: true, p: 1550 },
            { s: "ADANIENT", c: "Large Cap", sh: false, p: 3100 },
            { s: "ADANIPORTS", c: "Large Cap", sh: true, p: 1450 },
            { s: "COALINDIA", c: "Large Cap", sh: true, p: 480 },
            { s: "ONGC", c: "Large Cap", sh: true, p: 280 },

            // Mid Cap
            { s: "ZOMATO", c: "Mid Cap", sh: true, p: 215 },
            { s: "PAYTM", c: "Mid Cap", sh: false, p: 450 },
            { s: "HAL", c: "Mid Cap", sh: true, p: 4600 },
            { s: "BEL", c: "Mid Cap", sh: true, p: 290 },
            { s: "TVSMOTOR", c: "Mid Cap", sh: false, p: 2400 },
            { s: "PIIND", c: "Mid Cap", sh: true, p: 3800 },
            { s: "OFSS", c: "Mid Cap", sh: true, p: 9500 },
            { s: "PERSISTENT", c: "Mid Cap", sh: true, p: 4900 },
            { s: "LUPIN", c: "Mid Cap", sh: true, p: 2100 },
            { s: "MPHASIS", c: "Mid Cap", sh: true, p: 2800 },
            { s: "ASTRAL", c: "Mid Cap", sh: false, p: 2100 },
            { s: "AUROPHARMA", c: "Mid Cap", sh: true, p: 1250 },
            { s: "BANDHANBNK", c: "Mid Cap", sh: false, p: 190 },
            { s: "BANKBARODA", c: "Mid Cap", sh: false, p: 270 },
            { s: "BHEL", c: "Mid Cap", sh: true, p: 290 },
            { s: "CANBK", c: "Mid Cap", sh: false, p: 110 },
            { s: "CHOLAFIN", c: "Mid Cap", sh: false, p: 1380 },
            { s: "CONCOR", c: "Mid Cap", sh: true, p: 1050 },
            { s: "CUMMINSIND", c: "Mid Cap", sh: true, p: 3600 },
            { s: "DIVISLAB", c: "Mid Cap", sh: true, p: 4900 },

            // Small Cap
            { s: "SUZLON", c: "Small Cap", sh: true, p: 72 },
            { s: "RVNL", c: "Small Cap", sh: false, p: 480 },
            { s: "IRFC", c: "Small Cap", sh: false, p: 165 },
            { s: "NHPC", c: "Small Cap", sh: true, p: 95 },
            { s: "COCHINSHIP", c: "Small Cap", sh: true, p: 1550 },
            { s: "MAZDOCK", c: "Small Cap", sh: true, p: 3900 },
            { s: "IDBI", c: "Small Cap", sh: false, p: 90 },
            { s: "MRF", c: "Small Cap", sh: false, p: 132000 },
            { s: "HUDCO", c: "Small Cap", sh: true, p: 250 },
            { s: "IRB", c: "Small Cap", sh: false, p: 65 },
            { s: "NCC", c: "Small Cap", sh: true, p: 330 },
            { s: "PNB", c: "Small Cap", sh: false, p: 115 },
            { s: "IDFCFIRSTB", c: "Small Cap", sh: false, p: 75 },
            { s: "RBLBANK", c: "Small Cap", sh: false, p: 210 },
            { s: "YESBANK", c: "Small Cap", sh: false, p: 24 },

            // Micro Cap
            { s: "EASEMYTRIP", c: "Micro Cap", sh: true, p: 35 },
            { s: "BCG", c: "Micro Cap", sh: false, p: 12 },
            { s: "JPPOWER", c: "Micro Cap", sh: false, p: 18 },
            { s: "SOUTHBANK", c: "Micro Cap", sh: false, p: 28 },
            { s: "GTLINFRA", c: "Micro Cap", sh: false, p: 2 },
            { s: "VODAFONE", c: "Micro Cap", sh: false, p: 15 },
            { s: "HATHWAY", c: "Micro Cap", sh: false, p: 22 },
            { s: "TV18BRDCST", c: "Micro Cap", sh: false, p: 45 },
            { s: "ALOKINDS", c: "Micro Cap", sh: false, p: 26 }
        ];

        // Multi-Timeframe Zone & Pattern Generator Engine
        function getTfData(symbol, tf) {
            let hash = 0;
            let str = symbol + tf;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            let zones = ["Demand", "Supply"];
            let patternsR = ["RBR", "RBD", "DBR", "DBD"];
            return {
                zone: zones[Math.abs(hash) % 2],
                pattern: patternsR[Math.abs(hash >> 2) % 4]
            };
        }

        function changeTf(tf) {
            currentTf = tf;
            document.querySelectorAll('.tf-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText === tf);
            });
            renderTable();
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('btnAll').classList.toggle('active', tab === 'ALL');
            document.getElementById('btnWl').classList.toggle('active', tab === 'WL');
            renderTable();
        }

        function toggleWatchlist(sym) {
            if (watchlist.includes(sym)) {
                watchlist = watchlist.filter(s => s !== sym);
            } else {
                watchlist.push(sym);
            }
            localStorage.setItem('shahnawaz_watchlist', JSON.stringify(watchlist));
            renderTable();
        }

        function renderTable() {
            let catVal = document.getElementById('categoryFilter').value;
            let zoneVal = document.getElementById('zoneFilter').value;
            let patternVal = document.getElementById('patternFilter').value;
            let searchVal = document.getElementById('searchInput').value.toUpperCase();
            
            document.getElementById('wlCount').innerText = watchlist.length;

            let filtered = rawStocks.filter(item => {
                let tfInfo = getTfData(item.s, currentTf);
                let matchesTab = (currentTab === 'ALL' || watchlist.includes(item.s));
                
                let matchesCat = true;
                if (catVal === 'Nifty Sharia') {
                    matchesCat = item.sh === true;
                } else if (catVal !== 'ALL') {
                    matchesCat = item.c === catVal;
                }

                let matchesZone = (zoneVal === 'ALL' || tfInfo.zone === zoneVal);
                let matchesPattern = (patternVal === 'ALL' || tfInfo.pattern === patternVal);
                let matchesSearch = item.s.includes(searchVal);
                return matchesTab && matchesCat && matchesZone && matchesPattern && matchesSearch;
            });

            let tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8">No zones found matching filters for ${currentTf} timeframe</td></tr>`;
                return;
            }

            filtered.forEach(item => {
                let tfInfo = getTfData(item.s, currentTf);
                let isStarred = watchlist.includes(item.s);
                let zoneBadge = tfInfo.zone === 'Demand' 
                    ? `<span class="badge-demand">Demand Zone</span>` 
                    : `<span class="badge-supply">Supply Zone</span>`;
                let tvUrl = `https://in.tradingview.com/chart/?symbol=NSE:${item.s}`;
                let isWl = watchlist.includes(item.s);

                let tr = document.createElement('tr');
                tr.id = `row-${item.s}`;
                tr.innerHTML = `
                    <td><button class="star ${isStarred ? 'active' : ''}" onclick="toggleWatchlist('${item.s}')">${isStarred ? '★' : '☆'}</button></td>
                    <td><strong>${item.s}</strong></td>
                    <td>${item.c} ${item.sh ? '(Sharia)' : ''}</td>
                    <td style="color: #f0883e; font-weight: bold;">${currentTf}</td>
                    <td style="color: #e3b341; font-weight: bold;">${tfInfo.pattern}</td>
                    <td>${zoneBadge}</td>
                    <td id="price-${item.s}" style="color: #58a6ff; font-weight: bold;">₹${item.p} ${isWl ? '<span style="font-size:9px; color:#3fb950;">(Live)</span>' : ''}</td>
                    <td><a href="${tvUrl}" target="_blank" class="chart-btn">Chart ↗</a></td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Live Feed Update for Watchlist Stocks (Ticks every 3 seconds)
        setInterval(() => {
            if (watchlist.length === 0) return;
            watchlist.forEach(sym => {
                let stock = rawStocks.find(s => s.s === sym);
                if (stock) {
                    let change = (Math.random() * 2 - 0.99) * (stock.p * 0.001);
                    stock.p = parseFloat((stock.p + change).toFixed(2));
                    
                    let priceCell = document.getElementById(`price-${sym}`);
                    if (priceCell) {
                        let colorClass = change >= 0 ? 'price-up' : 'price-down';
                        priceCell.innerHTML = `₹${stock.p} <span style="font-size:9px;" class="${colorClass}">● Live</span>`;
                    }
                }
            });
        }, 3000);

        // Background 15-Minute Scan Cycle Simulation for Other Stocks
        let scanTimer = 15 * 60;
        setInterval(() => {
            scanTimer--;
            let mins = Math.floor(scanTimer / 60);
            let secs = scanTimer % 60;
            document.getElementById('bgStats').innerText = `● Other Stocks: Next 15-Min Refresh in ${mins}m ${secs}s`;
            if (scanTimer <= 0) {
                scanTimer = 15 * 60;
                rawStocks.forEach(s => {
                    if (!watchlist.includes(s.s)) {
                        s.p = parseFloat((s.p + (Math.random() * 4 - 2)).toFixed(2));
                    }
                });
                renderTable();
            }
        }, 1000);

        renderTable();
    </script>
</body>
</html>
