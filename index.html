<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Timeframe Stock Screener</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        h2 { color: #00ffcc; text-align: center; }
        .controls { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; align-items: center; flex-wrap: wrap; }
        select { padding: 10px; background: #222; color: #fff; border: 1px solid #444; border-radius: 5px; font-size: 16px; }
        table { width: 100%; border-collapse: collapse; background: #1e1e1e; border-radius: 8px; overflow: hidden; margin-top: 10px; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #333; }
        th { background-color: #2c2c2c; color: #00ffcc; }
        tr:hover { background-color: #252525; }
    </style>
</head>
<body>

    <h2>NSE Multi-Timeframe Stock Screener</h2>
    
    <div class="controls">
        <label for="timeframeSelect">Select Timeframe: </label>
        <select id="timeframeSelect" onchange="renderTable()">
            <option value="5m">5 Minutes</option>
            <option value="15m">15 Minutes</option>
            <option value="30m">30 Minutes</option>
            <option value="1 Hour">1 Hour</option>
            <option value="2 Hours">2 Hours</option>
            <option value="3 Hours">3 Hours</option>
            <option value="4 Hours">4 Hours</option>
            <option value="Daily" selected>Daily</option>
            <option value="Weekly">Weekly</option>
            <option value="Monthly">Monthly</option>
        </select>
    </div>

    <table id="screenerTable">
        <thead>
            <tr>
                <th>Symbol</th>
                <th>Market Cap</th>
                <th>Strategy</th>
                <th>Pattern</th>
                <th>Zone</th>
                <th>Price (<span id="selectedTfLabel">Daily</span>)</th>
            </tr>
        </thead>
        <tbody>
            <tr><td colspan="6">Loading market data...</td></tr>
        </tbody>
    </table>

    <script>
        let stockData = [];

        async function loadData() {
            try {
                let response = await fetch('stocks.json');
                stockData = await response.json();
                renderTable();
            } catch (error) {
                console.error("Error loading stocks.json:", error);
                document.querySelector("#screenerTable tbody").innerHTML = `<tr><td colspan="6" style="color:red;">Error loading stocks.json data.</td></tr>`;
            }
        }

        function renderTable() {
            let selectEl = document.getElementById("timeframeSelect");
            let selectedTf = selectEl ? selectEl.value : "Daily";
            
            let labelEl = document.getElementById("selectedTfLabel");
            if(labelEl) labelEl.innerText = selectedTf;
            
            let tbody = document.querySelector("#screenerTable tbody");
            if(!tbody) return;
            tbody.innerHTML = "";

            if (stockData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6">No data available</td></tr>`;
                return;
            }

            stockData.forEach(stock => {
                let price = "N/A";
                if (stock.prices && stock.prices[selectedTf] !== undefined) {
                    price = stock.prices[selectedTf];
                }

                let tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><strong>${stock.symbol}</strong></td>
                    <td>${stock.mCap}</td>
                    <td>${stock.strategy}</td>
                    <td>${stock.pattern}</td>
                    <td>${stock.zone}</td>
                    <td style="color: #00ffcc; font-weight: bold;">₹${price}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        loadData();
    </script>
</body>
</html>
