<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Screener - Demand & Supply Zones</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary: #3b82f6;
            --success: #22c55e;
            --danger: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            text-align: center;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        input, select {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            flex: 1;
            min-width: 150px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            color: var(--text-muted);
            font-weight: 600;
        }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .badge-buy { background-color: rgba(34, 197, 94, 0.2); color: var(--success); }
        .badge-sell { background-color: rgba(239, 68, 68, 0.2); color: var(--danger); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Stock Screener - Demand & Supply Zones</h1>
        
        <div class="card">
            <div class="controls">
                <input type="text" id="searchInput" placeholder="Search stock symbol..." onkeyup="applyFilters()">
                <select id="zoneFilter" onchange="applyFilters()">
                    <option value="">All Zones</option>
                    <option value="Demand">Demand Zone</option>
                    <option value="Supply">Supply Zone</option>
                </select>
            </div>

            <div style="overflow-x: auto;">
                <table id="stockTable">
                    <thead>
                        <tr>
                            <th>Symbol</th>
                            <th>LTP (₹)</th>
                            <th>Zone Type</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><b>CHAMBLFERT</b></td>
                            <td>465.50</td>
                            <td><span class="badge badge-buy">Demand</span></td>
                            <td>Hold / GTT Set</td>
                        </tr>
                        <tr>
                            <td><b>LT</b></td>
                            <td>3550.00</td>
                            <td><span class="badge badge-buy">Demand</span></td>
                            <td>Long-term</td>
                        </tr>
                        <tr>
                            <td><b>GSPC</b></td>
                            <td>445.00</td>
                            <td><span class="badge badge-sell">Supply</span></td>
                            <td>Exit Watch</td>
                        </tr>
                        <tr>
                            <td><b>SAKAR</b></td>
                            <td>940.00</td>
                            <td><span class="badge badge-sell">Supply</span></td>
                            <td>Review</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div style="margin-top: 12px; color: var(--text-muted); font-size: 0.85rem;">
                Showing <span id="countDisplay">4</span> stocks
            </div>
        </div>
    </div>

    <script>
        function applyFilters() {
            let input = document.getElementById('searchInput').value.toUpperCase();
            let filter = document.getElementById('zoneFilter').value;
            let table = document.getElementById('stockTable');
            let tr = table.getElementsByTagName('tr');
            let visibleCount = 0;

            for (let i = 1; i < tr.length; i++) {
                let tdSymbol = tr[i].getElementsByTagName('td')[0];
                let tdZone = tr[i].getElementsByTagName('td')[2];
                if (tdSymbol && tdZone) {
                    let txtValue = tdSymbol.textContent || tdSymbol.innerText;
                    let zoneValue = tdZone.textContent || tdZone.innerText;
                    
                    let matchesSearch = txtValue.toUpperCase().indexOf(input) > -1;
                    let matchesZone = filter === "" || zoneValue.indexOf(filter) > -1;

                    if (matchesSearch && matchesZone) {
                        tr[i].style.display = "";
                        visibleCount++;
                    } else {
                        tr[i].style.display = "none";
                    }
                }
            }
            document.getElementById('countDisplay').innerText = visibleCount;
        }

        window.onload = function() {
            applyFilters();
        };
    </script>
</body>
</html>
