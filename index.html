<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shahnawaz Mansuri Stock Screener</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; padding: 15px; }
        h2 { text-align: center; color: #00ffcc; }
        .controls { display: flex; justify-content: space-between; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        select, input, button { padding: 8px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; cursor: pointer; }
        button:hover { background: #333; color: #00ffcc; }
        table { width: 100%; border-collapse: collapse; background: #1e1e1e; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #333; font-size: 14px; }
        th { background-color: #333; color: #00ffcc; }
        .green { color: #00ff66; font-weight: bold; }
        .tv-link { color: #00bcd4; text-decoration: none; font-weight: bold; }
        .tv-link:hover { text-decoration: underline; }
        .actions-bar { margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
        .calc-box { background: #1a1a1a; padding: 15px; border: 1px solid #333; border-radius: 6px; margin-bottom: 20px; }
        .calc-box h3 { color: #00ffcc; margin-top: 0; font-size: 16px; }
        .calc-inputs { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    </style>
</head>
<body>

    <h2>Shahnawaz Mansuri Stock Screener</h2>

    <div class="calc-box">
        <h3>Risk-Reward & Target Calculator</h3>
        <div class="calc-inputs">
            <input type="number" id="calcEntry" placeholder="Entry Price (₹)" style="width: 140px;">
            <input type="number" id="calcSL" placeholder="Stop Loss (₹)" style="width: 140px;">
            <button onclick="calculateLevels()">Calculate Targets</button>
            <span id="calcResult" style="color: #00ff66; font-weight: bold;"></span>
        </div>
    </div>

    <div class="actions-bar">
        <input type="file" id="csvFile" accept=".csv" onchange="handleCSVUpload(event)">
        <button onclick="downloadCSV()">Download CSV</button>
        <button onclick="showWatchlist()">View Watchlist</button>
        <button onclick="renderTable(stockData)">All Stocks</button>
    </div>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search Stock..." onkeyup="filterStocks()">
        <select id="categorySelect" onchange="filterStocks()">
            <option value="ALL">All Categories</option>
            <option value="Large Cap">Large Cap</option>
            <option value="Mid Cap">Mid Cap</option>
            <option value="Small Cap">Small Cap</option>
            <option value="Micro Cap">Micro Cap</option>
            <option value="Shariah">Nifty Shariah</option>
        </select>
        <select id="strategySelect" onchange="filterStocks()">
            <option value="ALL">All Strategies / Zones</option>
            <option value="EMA_CROSS">9/20 EMA Crossover</option>
            <option value="Demand">Demand Zone</option>
            <option value="Bollinger">Bollinger Squeeze / Breakout</option>
            <option value="MACD_CCI">MACD / CCI Cross</option>
        </select>
    </div>
    
    <table id="stockTable">
        <thead>
            <tr>
                <th>Stock</th>
                <th>Category</th>
                <th>Price (₹)</th>
                <th>Zone / Pattern</th>
                <th>Strategy</th>
                <th>Chart</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <!-- Dynamic Data -->
        </tbody>
    </table>

    <script>
        let stockData = [
            { "s": "RELIANCE", "c": "Large Cap", "p": 2450.0, "zone": "Demand (Daily)", "pattern": "RBR", "strat": "9/20 Bullish Cross" },
            { "s": "TCS", "c": "Large Cap", "p": 3500.0, "zone": "Demand (Weekly)", "pattern": "DBR", "strat": "Bollinger Breakout" },
            { "s": "TATASTEEL", "c": "Mid Cap", "p": 130.0, "zone": "Demand (Monthly)", "pattern": "RBD", "strat": "MACD / CCI Cross" },
            { "s": "SUZLON", "c": "Small Cap", "p": 45.0, "zone": "Demand (Quarterly)", "pattern": "DBD", "strat": "9/20 Bullish Cross" }
        ];

        let watchlist = JSON.parse(localStorage.getItem('sm_watchlist')) || [];

        function renderTable(data) {
            const tbody = document.querySelector('#stockTable tbody');
            tbody.innerHTML = "";
            if(data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:red;">No Stocks Found</td></tr>`;
                return;
            }
            data.forEach(stock => {
                const tvUrl = `https://in.tradingview.com/chart/?symbol=NSE:${stock.s}`;
                const isWatched = watchlist.includes(stock.s);
                const row = `<tr>
                    <td><strong>${stock.s}</strong></td>
                    <td>${stock.c}</td>
                    <td class="green">₹${stock.p}</td>
                    <td>${stock.zone} (${stock.pattern})</td>
                    <td>${stock.strat}</td>
                    <td><a href="${tvUrl}" target="_blank" class="tv-link">TV Chart</a></td>
                    <td><button onclick="toggleWatchlist('${stock.s}')">${isWatched ? '★ Remove' : '☆ Watch'}</button></td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        function filterStocks() {
            const searchVal = document.getElementById('searchInput').value.toUpperCase();
            const catVal = document.getElementById('categorySelect').value;
            const stratVal = document.getElementById('strategySelect').value;

            const filtered = stockData.filter(stock => {
                const matchesSearch = stock.s.includes(searchVal);
                const matchesCat = (catVal === 'ALL' || stock.c === catVal);
                let matchesStrat = true;
                if(stratVal === 'EMA_CROSS') {
                    matchesStrat = stock.strat.includes('9/20');
                } else if(stratVal === 'Demand') {
                    matchesStrat = stock.zone.includes('Demand');
                } else if(stratVal === 'Bollinger') {
                    matchesStrat = stock.strat.includes('Bollinger');
                } else if(stratVal === 'MACD_CCI') {
                    matchesStrat = stock.strat.includes('MACD');
                }
                return matchesSearch && matchesCat && matchesStrat;
            });

            renderTable(filtered);
        }

        function calculateLevels() {
            const entry = parseFloat(document.getElementById('calcEntry').value);
            const sl = parseFloat(document.getElementById('calcSL').value);
            const resSpan = document.getElementById('calcResult');

            if(!entry || !sl || entry <= sl) {
                resSpan.innerHTML = "Enter valid Entry > Stop Loss";
                return;
            }

            const risk = entry - sl;
            const t1 = entry + (risk * 1);
            const t2 = entry + (risk * 2);
            const t3 = entry + (risk * 3);

            resSpan.innerHTML = `Risk: ₹${risk.toFixed(2)} | T1: ₹${t1.toFixed(2)} | T2: ₹${t2.toFixed(2)} | T3: ₹${t3.toFixed(2)}`;
        }

        function toggleWatchlist(symbol) {
            if(watchlist.includes(symbol)) {
                watchlist = watchlist.filter(s => s !== symbol);
            } else {
                watchlist.push(symbol);
            }
            localStorage.setItem('sm_watchlist', JSON.stringify(watchlist));
            filterStocks();
        }

        function showWatchlist() {
            const watchedStocks = stockData.filter(stock => watchlist.includes(stock.s));
            renderTable(watchedStocks);
        }

        function downloadCSV() {
            let csvContent = "data:text/csv;charset=utf-8,Stock,Category,Price,Zone,Pattern,Strategy\n";
            stockData.forEach(row => {
                csvContent += `${row.s},${row.c},${row.p},${row.zone},${row.pattern},${row.strat}\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "shahnawaz_screener_data.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function handleCSVUpload(event) {
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const lines = text.split("\n");
                let newStocks = [];
                for(let i = 1; i < lines.length; i++) {
                    const cols = lines[i].split(",");
                    if(cols.length >= 6) {
                        newStocks.push({
                            s: cols[0].trim(),
                            c: cols[1].trim(),
                            p: parseFloat(cols[2]) || 0,
                            zone: cols[3].trim(),
                            pattern: cols[4].trim(),
                            strat: cols[5].trim()
                        });
                    }
                }
                if(newStocks.length > 0) {
                    stockData = newStocks;
                    renderTable(stockData);
                    alert("CSV Data Uploaded Successfully!");
                } else {
                    alert("Invalid CSV Format!");
                }
            };
            reader.readAsText(file);
        }

        // Initial Load
        renderTable(stockData);
    </script>

</body>
</html>
