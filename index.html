<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHAHNAWAZ MANSURI - Verified Zone Screener</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: Arial, sans-serif; margin: 0; padding: 15px; }
        h1 { color: #00ffcc; text-align: center; font-size: 20px; margin-bottom: 5px; }
        .update-time { text-align: center; font-size: 12px; color: #888; margin-bottom: 15px; }
        .stats { text-align: center; font-size: 14px; margin-bottom: 15px; color: #aaa; }
        .controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        select, input, button { background: #1e1e1e; color: #fff; border: 1px solid #333; padding: 10px; border-radius: 5px; font-size: 14px; width: 100%; box-sizing: border-box; }
        button { background: #00ffcc; color: #121212; font-weight: bold; cursor: pointer; border: none; }
        button:hover { background: #00b38f; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #222; font-size: 13px; }
        th { background: #1a1a1a; color: #00ffcc; }
        .chart-btn { background: #0055ff; color: #fff; padding: 5px 10px; border-radius: 4px; text-decoration: none; font-size: 12px; display: inline-block; }
        .calc-btn { background: #ffaa00; color: #121212; padding: 5px 8px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; font-size: 12px; margin-top: 4px; }
        /* Modal Popup Styling */
        .modal { display: none; position: fixed; z-index: 10; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .modal-content { background: #1e1e1e; padding: 20px; border-radius: 8px; width: 90%; max-width: 350px; border: 1px solid #333; }
        .modal-content h3 { color: #00ffcc; margin-top: 0; font-size: 16px; }
        .modal-content input { margin-bottom: 10px; }
        .close-btn { background: #ff4444; color: #fff; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>SHAHNAWAZ MANSURI - Verified Zone Screener</h1>
    <div class="update-time" id="lastUpdated">Last Updated: Loading...</div>
    <div class="stats" id="totalStocks">Total Stocks Loaded: 0</div>

    <div class="controls">
        <input type="text" id="searchBox" placeholder="🔍 Search Symbol (e.g. RELIANCE)..." onkeyup="filterTable()">
        <select id="marketCapFilter" onchange="filterTable()">
            <option value="">All Market Caps</option>
        </select>
        <select id="strategyFilter" onchange="filterTable()">
            <option value="">All Strategies</option>
        </select>
        <select id="timeframeFilter" onchange="filterTable()">
            <option value="">All Timeframes</option>
        </select>
        <button onclick="exportToCSV()">📥 Download to CSV / Excel</button>
    </div>

    <div style="overflow-x: auto;">
        <table id="stockTable">
            <thead>
                <tr>
                    <th>Symbol</th>
                    <th>Market Cap</th>
                    <th>Strategy</th>
                    <th>Timeframe</th>
                    <th>Pattern / Zone</th>
                    <th>Close (₹)</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="7" style="text-align:center;">Loading data...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Risk-Reward Calculator Modal -->
    <div id="rrModal" class="modal">
        <div class="modal-content">
            <h3>Risk-Reward Calculator</h3>
            <p id="modalSymbol" style="font-weight:bold; color:#ffaa00;"></p>
            <label>Entry Price (₹):</label>
            <input type="number" id="entryPrice" placeholder="Enter Entry">
            <label>Stop Loss (₹):</label>
            <input type="number" id="stopLoss" placeholder="Enter SL">
            <label>Target Price (₹):</label>
            <input type="number" id="targetPrice" placeholder="Enter Target">
            <div id="rrResult" style="margin-top:10px; font-size:14px; color:#00ffcc;"></div>
            <button onclick="calculateRR()">Calculate R:R</button>
            <button class="close-btn" onclick="closeModal()">Close</button>
        </div>
    </div>

    <script>
        let allData = [];

        async function loadData() {
            try {
                let response = await fetch('stocks.json?' + new Date().getTime());
                allData = await response.json();
                
                let now = new Date();
                document.getElementById('lastUpdated').innerText = "Last Updated: " + now.toLocaleDateString() + " " + now.toLocaleTimeString();

                populateFilters(allData);
                displayTable(allData);
            } catch (error) {
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="7" style="text-align:center; color:red;">Error loading stocks.json</td></tr>`;
            }
        }

        function populateFilters(data) {
            let marketCaps = [...new Set(data.map(item => item["Market Cap"] || item["mCap"] || "-"))];
            let strategies = [...new Set(data.map(item => item["Strategy"] || item["strategy"] || "-"))];
            let timeframes = [...new Set(data.map(item => item["Timeframe"] || item["tf"] || "-"))];

            let mcSelect = document.getElementById('marketCapFilter');
            marketCaps.forEach(mc => { if(mc !== "-") mcSelect.innerHTML += `<option value="${mc}">${mc}</option>`; });

            let stSelect = document.getElementById('strategyFilter');
            strategies.forEach(st => { if(st !== "-") stSelect.innerHTML += `<option value="${st}">${st}</option>`; });

            let tfSelect = document.getElementById('timeframeFilter');
            timeframes.forEach(tf => { if(tf !== "-") tfSelect.innerHTML += `<option value="${tf}">${tf}</option>`; });
        }

        function displayTable(data) {
            let tbody = document.getElementById('tableBody');
            document.getElementById('totalStocks').innerText = "Total Stocks Loaded: " + data.length;
            
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;">No matching stocks found</td></tr>`;
                return;
            }

            let html = '';
            data.forEach((item) => {
                let symbol = item["Symbol"] || item["symbol"] || "-";
                let mCap = item["Market Cap"] || item["mCap"] || "-";
                let strategy = item["Strategy"] || item["strategy"] || "-";
                let tf = item["Timeframe"] || item["tf"] || "-";
                let pattern = (item["Pattern"] || item["pattern"] || "") + " (" + (item["Zone Type"] || item["zone"] || "") + ")";
                let close = item["Close (₹)"] || item["close"] || "-";

                let tvLink = `https://in.tradingview.com/chart/?symbol=NSE:${symbol}`;

                html += `<tr>
                    <td><strong>${symbol}</strong><br><a href="${tvLink}" target="_blank" class="chart-btn">Chart ↗</a></td>
                    <td>${mCap}</td>
                    <td>${strategy}</td>
                    <td>${tf}</td>
                    <td>${pattern}</td>
                    <td>₹${close}</td>
                    <td><button class="calc-btn" onclick="openModal('${symbol}', ${close})">R:R Calc</button></td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }

        function filterTable() {
            let query = document.getElementById('searchBox').value.toLowerCase();
            let mcVal = document.getElementById('marketCapFilter').value;
            let stVal = document.getElementById('strategyFilter').value;
            let tfVal = document.getElementById('timeframeFilter').value;

            let filtered = allData.filter(item => {
                let symbol = (item["Symbol"] || item["symbol"] || "").toLowerCase();
                let mCap = item["Market Cap"] || item["mCap"] || "";
                let strategy = item["Strategy"] || item["strategy"] || "";
                let tf = item["Timeframe"] || item["tf"] || "";

                let matchQuery = symbol.includes(query);
                let matchMc = mcVal === "" || mCap === mcVal;
                let matchSt = stVal === "" || strategy === stVal;
                let matchTf = tfVal === "" || tf === tfVal;

                return matchQuery && matchMc && matchSt && matchTf;
            });

            displayTable(filtered);
        }

        function exportToCSV() {
            let csv = 'Symbol,Market Cap,Strategy,Timeframe,Pattern,Close\n';
            allData.forEach(row => {
                let symbol = row["Symbol"] || row["symbol"] || "";
                let mCap = row["Market Cap"] || row["mCap"] || "";
                let strategy = row["Strategy"] || row["strategy"] || "";
                let tf = row["Timeframe"] || row["tf"] || "";
                let pattern = (row["Pattern"] || row["pattern"] || "") + " - " + (row["Zone Type"] || row["zone"] || "");
                let close = row["Close (₹)"] || row["close"] || "";
                csv += `"${symbol}","${mCap}","${strategy}","${tf}","${pattern}","${close}"\n`;
            });

            let blob = new Blob([csv], { type: 'text/csv' });
            let url = window.URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', 'verified_stocks_screener.csv');
            a.click();
        }

        function openModal(symbol, price) {
            document.getElementById('modalSymbol').innerText = "Stock: " + symbol;
            document.getElementById('entryPrice').value = price;
            document.getElementById('stopLoss').value = '';
            document.getElementById('targetPrice').value = '';
            document.getElementById('rrResult').innerText = '';
            document.getElementById('rrModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('rrModal').style.display = 'none';
        }

        function calculateRR() {
            let entry = parseFloat(document.getElementById('entryPrice').value);
            let sl = parseFloat(document.getElementById('stopLoss').value);
            let target = parseFloat(document.getElementById('targetPrice').value);

            if (isNaN(entry) || isNaN(sl) || isNaN(target)) {
                document.getElementById('rrResult').innerText = "Please enter valid numbers!";
                return;
            }

            let risk = Math.abs(entry - sl);
            let reward = Math.abs(target - entry);

            if (risk === 0) {
                document.getElementById('rrResult').innerText = "Risk cannot be zero!";
                return;
            }

            let ratio = (reward / risk).toFixed(2);
            document.getElementById('rrResult').innerText = `Risk: ₹${risk.toFixed(2)} | Reward: ₹${reward.toFixed(2)} | R:R = 1 : ${ratio}`;
        }

        loadData();
    </script>
</body>
</html>
