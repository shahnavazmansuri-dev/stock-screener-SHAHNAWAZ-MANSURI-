<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHAHNAWAZ MANSURI - Advanced Multi-Strategy Screener</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        header { text-align: center; margin-bottom: 20px; }
        header h1 { color: #00ffcc; margin: 0; font-size: 24px; }
        .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 20px; }
        select, button { padding: 10px; background-color: #1e1e1e; color: #fff; border: 1px solid #333; border-radius: 5px; cursor: pointer; }
        button:hover, select:hover { background-color: #333; }
        .table-container { max-height: 550px; overflow-y: auto; border: 1px solid #333; border-radius: 5px; }
        table { width: 100%; border-collapse: collapse; text-align: left; background-color: #1a1a1a; }
        th, td { padding: 12px; border-bottom: 1px solid #333; }
        th { background-color: #222; color: #00ffcc; position: sticky; top: 0; z-index: 10; }
        tr:hover { background-color: #2a2a2a; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-demand { background-color: #004d00; color: #66ff66; }
        .badge-supply { background-color: #4d0000; color: #ff6666; }
    </style>
</head>
<body>

<header>
    <h1>SHAHNAWAZ MANSURI - Multi-Strategy Zone Screener</h1>
    <p>Total Stocks Loaded: <span id="stockCount">314</span></p>
</header>

<div class="controls">
    <!-- Market Cap Filter -->
    <select id="marketCapFilter" onchange="filterTable()">
        <option value="All">All Market Caps</option>
        <option value="Large Cap">Large Cap</option>
        <option value="Mid Cap">Mid Cap</option>
        <option value="Small Cap">Small Cap</option>
        <option value="Micro Cap">Micro Cap</option>
    </select>

    <!-- Strategy Filter Tab -->
    <select id="strategyFilter" onchange="filterTable()">
        <option value="All">All Strategies</option>
        <option value="Nifty Sharia 500">Nifty Sharia 500</option>
        <option value="9/20 EMA Cross">9/20 EMA Cross</option>
        <option value="Bollinger Bands">Bollinger Bands</option>
        <option value="Breakout">Breakout</option> <!-- Fixed Breakout Tab -->
    </select>

    <!-- Timeframe Filter (Added Quarterly, Six Months, Yearly) -->
    <select id="timeframeFilter" onchange="filterTable()">
        <option value="All">All Timeframes</option>
        <option value="Daily">Daily</option>
        <option value="Weekly">Weekly</option>
        <option value="Monthly">Monthly</option>
        <option value="Quarterly">Quarterly</option>
        <option value="Six Months">Six Months</option>
        <option value="Yearly">Yearly</option>
    </select>
</div>

<div class="table-container">
    <table id="screenerTable">
        <thead>
            <tr>
                <th>Symbol</th>
                <th>Market Cap</th>
                <th>Strategy</th>
                <th>Timeframe</th>
                <th>Pattern</th>
                <th>Zone Type</th>
                <th>Close (₹)</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Dynamic Rows will load here -->
        </tbody>
    </table>
</div>

<script>
    // Sample data structure for your 314 stocks (Aap yahan apne saare 314 stocks ka data array add kar sakte hain)
    const stocksData = [
        { symbol: "RELIANCE", mCap: "Large Cap", strategy: "Nifty Sharia 500", tf: "Daily", pattern: "RBR", zone: "Demand", price: 2850 },
        { symbol: "TCS", mCap: "Large Cap", strategy: "Breakout", tf: "Weekly", pattern: "RBD", zone: "Supply", price: 3900 },
        { symbol: "INFY", mCap: "Large Cap", strategy: "9/20 EMA Cross", tf: "Quarterly", pattern: "DBR", zone: "Demand", price: 1600 },
        { symbol: "TATAMOTORS", mCap: "Mid Cap", strategy: "Breakout", tf: "Six Months", pattern: "DBD", zone: "Supply", price: 950 },
        { symbol: "SBIN", mCap: "Large Cap", strategy: "Bollinger Bands", tf: "Yearly", pattern: "RBR", zone: "Demand", price: 800 },
        { symbol: "ITC", mCap: "Large Cap", strategy: "Nifty Sharia 500", tf: "Monthly", pattern: "RBD", zone: "Supply", price: 440 }
        // Aap apne baaki 314 stocks is array me paste kar sakte hain
    ];

    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = "";
        
        if(data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#888;">No stocks found matching the criteria.</td></tr>`;
            return;
        }

        data.forEach(stock => {
            const row = document.createElement('tr');
            const badgeClass = stock.zone === 'Demand' ? 'badge-demand' : 'badge-supply';
            row.innerHTML = `
                <td><b>${stock.symbol}</b></td>
                <td>${stock.mCap}</td>
                <td>${stock.strategy}</td>
                <td>${stock.tf}</td>
                <td>${stock.pattern}</td>
                <td><span class="badge ${badgeClass}">${stock.zone} Zone</span></td>
                <td>₹${stock.price}</td>
            `;
            tbody.appendChild(row);
        });
        document.getElementById('stockCount').innerText = data.length;
    }

    function filterTable() {
        const mCapVal = document.getElementById('marketCapFilter').value;
        const strategyVal = document.getElementById('strategyFilter').value;
        const tfVal = document.getElementById('timeframeFilter').value;

        const filtered = stocksData.data ? stocksData : stocksData.filter(stock => {
            const matchMCap = (mCapVal === 'All' || stock.mCap === mCapVal);
            const matchStrategy = (strategyVal === 'All' || stock.strategy === strategyVal);
            const matchTf = (tfVal === 'All' || stock.tf === tfVal);
            return matchMCap && matchStrategy && matchTf;
        });

        renderTable(filtered);
    }

    // Initial load
    renderTable(stocksData);
</script>

</body>
</html>
