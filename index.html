
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Demand & Supply Stock Screener</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; padding: 15px; }
        h2 { text-align: center; color: #00ffcc; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #1e1e1e; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { background-color: #333; color: #00ffcc; }
        .green { color: #00ff66; font-weight: bold; }
    </style>
</head>
<body>

    <h2>NSE Stock Screener (Live)</h2>
    
    <table id="stockTable">
        <thead>
            <tr>
                <th>Stock</th>
                <th>Category</th>
                <th>Price (₹)</th>
                <th>Zone</th>
                <th>Pattern</th>
            </tr>
        </thead>
        <tbody>
            <!-- Data will be loaded dynamically -->
        </tbody>
    </table>

    <script>
        // Directly embedded JSON data to avoid CORS and loading errors on mobile
        const stockData = [
            {
                "s": "RELIANCE",
                "c": "Large Cap",
                "p": 2450.0,
                "vol": 5400000,
                "zone": "Demand",
                "pattern": "RBR",
                "strat": "EMA9_21"
            },
            {
                "s": "TCS",
                "c": "Large Cap",
                "p": 3500.0,
                "vol": 2100000,
                "zone": "Demand",
                "pattern": "RBR",
                "strat": "EMA9_21"
            }
        ];

        const tbody = document.querySelector('#stockTable tbody');
        tbody.innerHTML = ""; 
        
        stockData.forEach(stock => {
            const row = `<tr>
                <td><strong>${stock.s}</strong></td>
                <td>${stock.c}</td>
                <td class="green">₹${stock.p}</td>
                <td>${stock.zone}</td>
                <td>${stock.pattern}</td>
            </tr>`;
            tbody.innerHTML += row;
        });
    </script>

</body>
</html>
